<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Арена</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05070f; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 7, 15, 0.9); color: white; }
        .btn-ui { padding: 12px 24px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #customizer-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8; padding: 20px; border-radius: 12px; z-index: 100; width: 280px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); color: white; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-size: 13px; }
        .mode-btn { background: #1e293b; border: 2px solid #475569; padding: 15px; border-radius: 10px; width: 130px; text-align: center; cursor: pointer; color: #94a3b8; }
        .mode-btn.active { border-color: #ec4899; color: white; background: rgba(236, 72, 153, 0.1); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="auth-screen" class="overlay">
        <h2 style="color: #38bdf8; margin-bottom: 20px; letter-spacing: 1px;">ВЫБЕРИТЕ РЕЖИМ ИГРЫ</h2>
        <div style="display: flex; gap: 20px; margin-bottom: 25px;">
            <div id="mode-coop-select" class="mode-btn active" onclick="selectGameMode('coop')">
                <i class="fa-solid fa-biohazard" style="font-size: 24px; color: #10b981; margin-bottom: 8px;"></i>
                <div>ЗАЧИСТКА ВОЛН</div>
            </div>
            <div id="mode-pvp-select" class="mode-btn" onclick="selectGameMode('pvp')">
                <i class="fa-solid fa-gun" style="font-size: 24px; color: #ef4444; margin-bottom: 8px;"></i>
                <div>КОМАНДНЫЙ БОЙ</div>
            </div>
        </div>
        <input type="text" id="input-nick" placeholder="Имя бойца" value="Игрок" style="background: #1e293b; border: 1px solid #38bdf8; padding: 12px; color: white; border-radius: 8px; width: 260px; text-align: center; margin-bottom: 10px; font-size: 16px;">
        <input type="password" id="input-pass" placeholder="Пароль" value="123" style="background: #1e293b; border: 1px solid #38bdf8; padding: 12px; color: white; border-radius: 8px; width: 260px; text-align: center; margin-bottom: 20px; font-size: 16px;">
        <button id="btn-auth" class="btn-ui" style="background: #475569; width: 284px; font-size: 16px;" disabled>ПИНГУЕМ СЕРВЕР...</button>
        <div id="auth-status" style="margin-top: 15px; font-size: 13px; color: #64748b;">Установка связи с сервером...</div>
    </div>

    <div id="hud-scalable-wrapper" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 5;">
        <div id="val-timer" class="hud-element" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; font-family: monospace; font-size: 18px; font-weight: bold; color: #38bdf8; pointer-events: auto;">ЗАГРУЗКА...</div>
        <button id="btn-skip-break" class="hud-element btn-ui" style="position: absolute; top: 75px; left: 50%; transform: translateX(-50%); background: #10b981; display: none; font-size: 12px; padding: 6px 14px; pointer-events: auto;">ПРОПУСТИТЬ ПЕРЕРЫВ (<span id="skip-votes-count">0</span>)</button>
        <div id="btn-menu-trigger" class="hud-element" style="position: absolute; top: 20px; right: 20px; width: 42px; height: 42px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; pointer-events: auto; cursor: pointer;"><i class="fa-solid fa-gear"></i></div>
        
        <div id="hud-stats-block" class="hud-element" style="position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.6); padding: 10px 15px; border-radius: 10px; color: white; min-width: 120px;">
            <div style="margin-bottom: 4px;"><i class="fa-solid fa-heart" style="color: #ef4444;"></i> <span id="val-hp">100</span></div>
            <div><i class="fa-solid fa-shield-halved" style="color: #3b82f6;"></i> <span id="val-armor">100</span></div>
        </div>

        <div id="hud-weapon-block" class="hud-element" style="position: absolute; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.6); padding: 10px 15px; border-radius: 10px; color: white; text-align: right; min-width: 100px;">
            <div style="font-weight: bold; font-size: 18px;" id="val-ammo">30 / 120</div>
            <div style="font-size: 12px; color: #94a3b8;">Убийств: <span id="val-kills">0</span></div>
        </div>

        <div id="minimap-radar" class="hud-element" style="position: absolute; top: 20px; left: 20px; width: 110px; height: 110px; background: rgba(15, 23, 42, 0.5); border: 2px solid #1e40af; border-radius: 50%; pointer-events: auto;">
            <div class="radar-dot dot-me" style="position: absolute; top: 53px; left: 53px; width: 4px; height: 4px; background: #38bdf8; border-radius: 50%;"></div>
        </div>

        <div id="joystick-zone" class="hud-element" style="position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto;">
            <div id="joystick-stick" style="position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #38bdf8; border-radius: 50%;"></div>
        </div>
        <div id="btn-fire" class="hud-element" style="position: absolute; bottom: 50px; right: 140px; width: 70px; height: 70px; background: rgba(239, 68, 68, 0.4); border: 2px solid #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; pointer-events: auto;"><i class="fa-solid fa-crosshairs"></i></div>
        <div id="btn-reload" class="hud-element" style="position: absolute; bottom: 40px; right: 230px; width: 50px; height: 50px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; pointer-events: auto;"><i class="fa-solid fa-rotate"></i></div>
        <div id="btn-jump" class="hud-element" style="position: absolute; bottom: 130px; right: 50px; width: 50px; height: 50px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; pointer-events: auto;"><i class="fa-solid fa-arrow-up"></i></div>
        <div id="btn-crouch" class="hud-element" style="position: absolute; bottom: 40px; right: 50px; width: 50px; height: 50px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; pointer-events: auto;"><i class="fa-solid fa-arrow-down"></i></div>
    </div>

    <div id="damage-flash" style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgb(239, 68, 68); opacity:0; pointer-events:none; z-index:4; transition: opacity 0.1s ease-out;"></div>
    <div id="damage-indicators-container" style="position: absolute; top:50%; left:50%; width:0; height:0; pointer-events:none; z-index:4;"></div>

    <div id="respawn-screen" class="overlay" style="display: none; background: rgba(239, 64, 64, 0.3);">
        <h1>ВЫ ПОГИБЛИ</h1>
        <button id="btn-respawn" class="btn-ui" style="background: #10b981;">ВЕРНУТЬСЯ В СТРОЙ</button>
    </div>

    <div id="customizer-menu">
        <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
            <div id="menu-user-nick" style="font-size: 20px; font-weight: bold; color: #38bdf8;">Загрузка...</div>
            <div id="menu-user-mode" style="font-size: 12px; font-weight: bold; margin-top: 5px;">-</div>
        </div>
        <button id="btn-menu-switch-coop" class="btn-ui" style="background: #10b981; width: 48%;">ЗАЧИСТКА</button>
        <button id="btn-menu-switch-pvp" class="btn-ui" style="background: #ef4444; width: 48%;">PVP</button>
        <div class="setting-row" style="margin-top:15px;">
            <span>Размер HUD:</span>
            <input type="range" id="scale-slider" min="0.5" max="1.5" step="0.05" value="1">
        </div>
        <button id="btn-save-hud" class="btn-ui" style="background: #3b82f6; width: 100%; margin-top: 15px;">В БОЙ</button>
        <button id="btn-logout" class="btn-ui" style="background: #ef4444; width: 100%; margin-top: 5px;">ВЫХОД</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
