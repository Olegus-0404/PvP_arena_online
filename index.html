<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D PvP Cyber Arena</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h2>Вход в Кибер-Арену</h2>
            <input type="text" id="input-nick" class="auth-input" placeholder="Никнейм (от 2 симв.)" maxlength="12">
            <input type="password" id="input-pass" class="auth-input" placeholder="Пароль (от 3 симв.)">
            <button id="btn-auth" class="auth-btn">Войти / Создать</button>
            <div id="auth-status">Ожидание сервера...</div>
        </div>
    </div>

    <div id="hud">
        <div id="hud-hp" class="hud-bar">❤️ HP: 100</div>
        <div id="hud-armor" class="hud-bar">🛡️ Броня: 0</div>
        <div id="hud-ammo" class="hud-bar">🔫 Патроны: 30 / 120</div>
    </div>

    <div id="game-timer">03:00</div>

    <div id="top-right-controls">
        <div id="kills-counter">💀 Убийства: 0</div>
        <div class="control-row">
            <button id="btn-settings" class="small-btn">⚙️ НАСТРОЙКИ</button>
            <button id="btn-fullscreen" class="small-btn">📺 ЭКРАН</button>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="canvas-container"></div>

    <div id="joystick-zone" class="draggable">
        <div id="joystick-stick"></div>
    </div>

    <button id="btn-fire" class="btn-action draggable"></button>
    <button id="btn-jump" class="btn-action draggable"></button>
    <button id="btn-crouch" class="btn-action draggable"></button>
    <button id="btn-reload" class="btn-action draggable"></button>

    <div id="settings-panel">
        <h3>Настройки игры</h3>
        
        <button id="btn-leave-match" class="panel-btn" onclick="leaveMatch()">🚪 Выйти в меню</button>
        
        <div class="setting-item">
            <span>Чувствительность:</span>
            <input type="range" id="slider-sens" min="1" max="100" value="35">
        </div>
        <div class="setting-item">
            <span>Инверсия Y:</span>
            <input type="checkbox" id="check-invert">
        </div>
        <div class="setting-item">
            <span>Качество графики:</span>
            <select id="select-graphics">
                <option value="high">Высокое</option>
                <option value="medium" selected>Среднее</option>
                <option value="low">Низкое (FPS+)</option>
            </select>
        </div>
        
        <div class="panel-grid-buttons">
            <button id="btn-custom-layout" class="panel-btn">📐 Изменить раскладку</button>
            <button id="btn-save-settings" class="panel-btn">💾 ОК</button>
            <button id="btn-close-settings" class="panel-btn">❌ Отмена</button>
            <button id="btn-reset-all" class="panel-btn">🔄 Сбросить всё</button>
        </div>
    </div>

    <div id="layout-edit-subpanel">
        <p style="margin:0 0 10px 0; font-weight:bold; color:#eab308;">Режим настройки кнопок</p>
        <span style="font-size:12px; color:#94a3b8; display:block; margin-bottom:12px;">Перетаскивай элементы пальцем по экрану</span>
        <button id="btn-save-layout" class="panel-btn" style="background:#10b981; color:white; padding:8px 16px;">Сохранить раскладку</button>
    </div>

    <div id="respawn-screen">
        <h1 style="color:#ef4444; font-size:32px; margin-bottom:5px; text-transform:uppercase; letter-spacing:2px;">Ты погиб!</h1>
        <p style="color:#94a3b8; margin-bottom:20px;">Тебя ликвидировал соперник</p>
        <button id="btn-respawn" class="auth-btn" style="max-width:200px; margin:0;">Возродиться</button>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
