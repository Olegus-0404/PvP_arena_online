<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D PvP Shooter Online</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        
        /* Игровой интерфейс (HUD) по твоему ТЗ */
        #hud { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .hud-bar { background: rgba(0, 0, 0, 0.6); padding: 8px 15px; border-radius: 5px; border-left: 5px solid #fff; font-weight: bold; font-size: 14px; color: #fff; text-shadow: 1px 1px 2px #000; }
        #hud-hp { border-left-color: #ff3333; }
        #hud-armor { border-left-color: #3333ff; }
        #hud-ammo { position: absolute; bottom: 25px; left: 25px; border-left-color: #ffff33; z-index: 10; font-size: 18px; pointer-events: none; }
        
        /* Счетчик убийств и лидерборд */
        #kills-counter { position: absolute; top: 15px; right: 15px; background: rgba(255, 0, 50, 0.4); border: 2px solid #ff0033; }
        #leaderboard-screen, #voting-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; display: none; }
        .vote-btn { background: #222; border: 2px solid #555; color: white; padding: 12px 30px; margin: 10px; font-size: 18px; border-radius: 8px; pointer-events: auto; }
        .vote-btn:active { background: #ff0055; border-color: #fff; }

        /* Прицел */
        #reticle { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #reticle::before, #reticle::after { content: ''; position: absolute; background: rgba(0,255,255,0.8); }
        #reticle::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #reticle::after { top: 0; left: 5px; width: 2px; height: 12px; }

        /* Экран смерти */
        #death-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(150, 0, 0, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; color: white; display: none; }
        #respawn-btn { background: #fff; color: #000; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; pointer-events: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* Тач-зоны управления на смартфонах */
        .touch-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 20px; pointer-events: none; z-index: 20; }
        .zone { width: 35%; height: 85%; background: rgba(255,255,255,0.01); border: 1px dashed rgba(255,255,255,0.05); border-radius: 20px; pointer-events: auto; position: relative; }
        
        /* Кнопки действий справа */
        .action-container { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; z-index: 30; }
        .circle-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #fff; color: white; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
        #btn-shoot { width: 85px; height: 85px; background: linear-gradient(135deg, #ff0055, #990022); font-size: 16px; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
        #btn-shoot:active { background: #ff0055; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="reticle"></div>
        
        <div id="hud">
            <div class="hud-bar" id="hud-hp">❤️ HP: 100</div>
            <div class="hud-bar" id="hud-armor">🛡️ ARM: 100</div>
            <div class="hud-bar" id="kills-counter">💀 Убийства: 0 / 15</div>
        </div>
        <div class="hud-bar" id="hud-ammo">🔫 Ammo: 30 / 90</div>

        <div class="touch-container">
            <div class="zone" id="move-pad"></div>
            <div class="zone" id="look-pad"></div>
        </div>

        <div class="action-container">
            <div class="circle-btn" id="btn-shoot">ОГОНЬ</div>
            <div class="circle-btn" id="btn-reload">🔄 ПЕРЕЗР.</div>
            <div class="circle-btn" id="btn-jump">🚀 ПРЫЖОК</div>
        </div>

        <div id="death-screen">
            <h1 style="font-size: 40px; margin-bottom: 20px;">ВЫ ПОГИБЛИ</h1>
            <button id="respawn-btn">РЕСПАВН</button>
        </div>

        <div id="leaderboard-screen">
            <h1 style="color: #ffcc00; margin-bottom: 15px;">МАТЧ ОКОНЧЕН</h1>
            <div id="leaderboard-list" style="font-size: 20px; line-height: 2; margin-bottom: 30px;"></div>
        </div>

        <div id="voting-screen">
            <h2>ВЫБЕРИТЕ СЛЕДУЮЩУЮ КАРТУ</h2>
            <button class="vote-btn" onclick="voteForMap('arena')">[ АРЕНА ] (<span id="v-arena">0</span> гол.)</button>
            <button class="vote-btn" onclick="voteForMap('factory')">[ ЗАВОД ] (<span id="v-factory">0</span> гол.)</button>
            <button class="vote-btn" onclick="voteForMap('city')">[ ГОРОД ] (<span id="v-city">0</span> гол.)</button>
        </div>
    </div>

    <script>
        // Подключение к твоему бэкенду на Render (поменяй URL на свой адрес сервера Render!)
        const socket = io('https://pvp-arena-online-server.onrender.com'); 

        // Настройки сцены Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Свет
        const light = new THREE.AmbientLight(0xffffff, 0.3); scene.add(light);
        const dirLight = new THREE.DirectionalLight(0x00ffff, 0.7); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        // Переменные состояния игрока по ТЗ
        let hp = 100, armor = 100, ammo = 30, reserveAmmo = 90;
        let kills = 0;
        let isDead = false;
        let currentMap = 'arena';

        // Локальные переменные управления
        let moveInput = { x: 0, y: 0 }, lookInput = { x: 0, y: 0 };
        let rotY = 0, rotX = 0;
        let verticalVelocity = 0; 
        let isGrounded = true;

        // Хранилище сетевых соперников
        const opponents = {};

        // Рендеринг пола
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111122 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);
        const grid = new THREE.GridHelper(60, 30, 0x00ffff, 0x333333); scene.add(grid);

        // Генерация укрытий (Стен) в зависимости от карты
        let wallMeshes = [];
        function buildMap(mapName) {
            wallMeshes.forEach(w => scene.remove(w));
            wallMeshes = [];
            
            let wallColor = 0x330066;
            if(mapName === 'factory') wallColor = 0x555555;
            if(mapName === 'city') wallColor = 0x224455;

            const boxGeo = new THREE.BoxGeometry(4, 4, 4);
            const boxMat = new THREE.MeshStandardMaterial({ color: wallColor });

            // Простая расстановка пары укрытий
            for(let i = 0; i < 6; i++) {
                const wall = new THREE.Mesh(boxGeo, boxMat);
                wall.position.set((Math.sin(i)*12), 2, (Math.cos(i)*12));
                scene.add(wall);
                wallMeshes.push(wall);
            }
        }
        buildMap('arena');

        // Мобильные тачпады
        setupJoystick('move-pad', (dx, dy) => { moveInput.x = dx; moveInput.y = dy; });
        setupLookPad('look-pad');

        function setupJoystick(id, callback) {
            const el = document.getElementById(id);
            let tid = null, sx = 0, sy = 0;
            el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tid = t.identifier; sx = t.clientX; sy = t.clientY; });
            el.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === tid) {
                        let dx = (t.clientX - sx)/50; let dy = (t.clientY - sy)/50;
                        let d = Math.sqrt(dx*dx+dy*dy); if(d>1){dx/=d; dy/=d;}
                        callback(dx, -dy);
                    }
                }
            });
            el.addEventListener('touchend', e => { for(let t of e.changedTouches) { if(t.identifier === tid){ tid=null; callback(0,0); } } });
        }

        function setupLookPad(id) {
            const el = document.getElementById(id);
            let tid = null, lx = 0, ly = 0;
            el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tid = t.identifier; lx = t.clientX; ly = t.clientY; });
            el.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === tid) {
                        rotY -= (t.clientX - lx) * 0.006;
                        rotX -= (t.clientY - ly) * 0.006;
                        rotX = Math.max(-Math.PI/2.4, Math.min(Math.PI/2.4, rotX));
                        lx = t.clientX; ly = t.clientY;
                    }
                }
            });
            el.addEventListener('touchend', e => { for(let t of e.changedTouches) { if(t.identifier === tid) tid=null; } });
        }

        // Действия: Стрельба, Перезарядка, Прыжок
        document.getElementById('btn-shoot').addEventListener('touchstart', shootWeapon);
        document.getElementById('btn-reload').addEventListener('touchstart', reloadWeapon);
        document.getElementById('btn-jump').addEventListener('touchstart', () => { if(isGrounded && !isDead) { verticalVelocity = 0.15; isGrounded = false; } });
        document.getElementById('respawn-btn').addEventListener('click', () => { socket.emit('requestRespawn'); document.getElementById('death-screen').style.display = 'none'; isDead = false; });

        function updateHUD() {
            document.getElementById('hud-hp').innerText = `❤️ HP: ${hp}`;
            document.getElementById('hud-armor').innerText = `🛡️ ARM: ${armor}`;
            document.getElementById('hud-ammo').innerText = `🔫 Ammo: ${ammo} / ${reserveAmmo}`;
            document.getElementById('kills-counter').innerText = `💀 Убийства: ${kills} / 15`;
        }

        function shootWeapon() {
            if(ammo <= 0 || isDead) return;
            ammo--;
            updateHUD();

            // Прямой луч из прицела (Рейкастинг для попаданий)
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);

            // Собираем 3D-модели врагов для проверки на урон
            const targets = [];
            Object.values(opponents).forEach(op => targets.push(op.mesh));

            const intersects = raycaster.intersectObjects(targets);
            if(intersects.length > 0) {
                const hitObj = intersects[0].object;
                let hitZone = 'body'; 
                // Если попали в верхнюю часть куба врага — засчитаем как голову
                if(intersects[0].point.y > 1.4) hitZone = 'head'; 

                socket.emit('playerHit', { targetId: hitObj.name, zone: hitZone });
            }
        }

        function reloadWeapon() {
            if(reserveAmmo <= 0 || ammo === 30 || isDead) return;
            let needed = 30 - ammo;
            if(reserveAmmo >= needed) { ammo += needed; reserveAmmo -= needed; } 
            else { ammo += reserveAmmo; reserveAmmo = 0; }
            updateHUD();
        }

        function voteForMap(mapName) {
            socket.emit('voteMap', mapName);
        }

        // --- СЕТЕВАЯ ЛОГИКА СЕРВЕРА ---
        socket.on('init', (data) => {
            camera.position.set(data.x, 2, data.z);
        });

        socket.on('updatePlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach(id => {
                if(id === socket.id) {
                    hp = serverPlayers[id].hp;
                    armor = serverPlayers[id].armor;
                    kills = serverPlayers[id].kills;
                    updateHUD();

                    if(hp <= 0 && !isDead) {
                        isDead = true;
                        document.getElementById('death-screen').style.display = 'flex';
                    }
                    return;
                }

                // Отрисовка чужих игроков (в виде 3D капсул/кубов)
                if(!opponents[id]) {
                    const geo = new THREE.BoxGeometry(1.5, 2, 1.5);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.name = id;
                    scene.add(mesh);
                    opponents[id] = { mesh };
                }

                opponents[id].mesh.position.set(serverPlayers[id].x, 1, serverPlayers[id].z);
            });

            // Удаление вышедших игроков
            Object.keys(opponents).forEach(id => {
                if(!serverPlayers[id]) { scene.remove(opponents[id].mesh); delete opponents[id]; }
            });
        });

        socket.on('mapChange', (mapName) => {
            currentMap = mapName;
            buildMap(mapName);
            document.getElementById('voting-screen').style.display = 'none';
            document.getElementById('leaderboard-screen').style.display = 'none';
        });

        socket.on('matchEnd', (data) => {
            document.getElementById('leaderboard-screen').style.display = 'flex';
            let list = document.getElementById('leaderboard-list');
            list.innerHTML = data.leaderboard.map((p, i) => `${i+1}. Игрок: ${p.id.substring(0,5)} — ${p.kills} убийств`).join('<br>');
            
            setTimeout(() => {
                document.getElementById('voting-screen').style.display = 'flex';
            }, 5000);
        });

        socket.on('updateVotes', (votes) => {
            document.getElementById('v-arena').innerText = votes.arena || 0;
            document.getElementById('v-factory').innerText = votes.factory || 0;
            document.getElementById('v-city').innerText = votes.city || 0;
        });

        // Основной цикл анимации кадров
        function animate() {
            requestAnimationFrame(animate);

            if(!isDead) {
                camera.rotation.order = "YXZ";
                camera.rotation.y = rotY;
                camera.rotation.x = rotX;

                // Движение вперед/назад/боком
                const speed = 0.08;
                let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                let side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                side.y = 0; side.normalize();

                camera.position.addScaledVector(forward, moveInput.y * speed);
                camera.position.addScaledVector(side, moveInput.x * speed);

                // Прыжки и простая гравитация
                camera.position.y += verticalVelocity;
                if(camera.position.y > 2) {
                    verticalVelocity -= 0.008; // Сила тяжести
                } else {
                    camera.position.y = 2;
                    verticalVelocity = 0;
                    isGrounded = true;
                }

                // Границы карты
                camera.position.x = Math.max(-28, Math.min(28, camera.position.x));
                camera.position.z = Math.max(-28, Math.min(28, camera.position.z));

                // Отправляем свои координаты на сервер
                socket.emit('playerMove', { x: camera.position.x, z: camera.position.z });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
