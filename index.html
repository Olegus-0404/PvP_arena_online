<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>PvP Arena Online v2</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #121212;
    font-family: 'Segoe UI', Roboto, sans-serif;
    color: #fff;
}

/* ========================================================= */
/* ИГРОВАЯ СЦЕНА                                             */
/* ========================================================= */

#canvas-container {
    width: 100%;
    height: 100%;

    position: absolute;
    top: 0;
    left: 0;

    z-index: 1;
}

#camera-look-zone {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: 5;

    touch-action: none;
}

body.in-menu #camera-look-zone,
body.in-menu #hud-scalable-wrapper,
body.in-menu #game-crosshair,
body.in-menu #round-banner {
    display: none;
}

/* ========================================================= */
/* SVG                                                       */
/* ========================================================= */

.svg-icon {
    width: 24px;
    height: 24px;

    display: block;

    fill: none;
    stroke: currentColor;

    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;

    pointer-events: none;
}

.svg-icon-fill {
    fill: currentColor;
    stroke: none;
}

/* ========================================================= */
/* ОКНА                                                       */
/* ========================================================= */

.overlay {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: #1e1e1e;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

    overflow: auto;
}

.auth-container {
    background: #2d2d2d;

    border: 1px solid #444;

    border-radius: 8px;

    padding: 30px;

    width: 100%;
    max-width: 400px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.5);
}

.auth-container h1 {
    color: #fff;

    margin-bottom: 20px;

    font-size: 24px;

    font-weight: 600;
}

.auth-input {
    width: 100%;

    padding: 14px;

    background: #1e1e1e;

    border: 1px solid #444;

    color: #fff;

    border-radius: 6px;

    margin-bottom: 12px;

    font-size: 15px;

    outline: none;

    transition: 0.2s;
}

.auth-input:focus {
    border-color: #888;
}

.btn-main {
    width: 100%;

    min-height: 48px;

    padding: 12px 14px;

    background: #3a3a3a;

    color: white;

    border: 1px solid #555;

    border-radius: 6px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.15s;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 9px;
}

.btn-main:hover {
    background: #4a4a4a;
}

.btn-main:active {
    transform: scale(0.98);
}

.btn-secondary {
    background: transparent;

    margin-top: 10px;
}

.btn-secondary:hover {
    background: rgba(255,255,255,0.08);
}

/* ========================================================= */
/* АВАТАР                                                     */
/* ========================================================= */

.menu-avatar {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    overflow: hidden;

    margin: 0 auto 15px;

    cursor: pointer;

    border: 2px solid #555;

    background: #222;
}

.menu-avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.avatar-edit-hint {
    display: block;

    font-size: 11px;

    color: #888;

    margin-top: 6px;
}

/* ========================================================= */
/* НАСТРОЙКИ                                                  */
/* ========================================================= */

.settings-section {
    text-align: left;

    margin-bottom: 18px;
}

.settings-section h3 {
    font-size: 12px;

    color: #aaa;

    text-transform: uppercase;

    margin-bottom: 8px;

    letter-spacing: 0.5px;
}

.settings-container {
    max-height: 85vh;

    overflow-y: auto;
}

input[type=color]#crosshair-color {
    width: 100%;
    height: 40px;

    padding: 2px;

    margin-bottom: 10px;

    background: #1e1e1e;

    border: 1px solid #444;

    border-radius: 6px;
}

input[type=range]#crosshair-size {
    width: 100%;

    margin-bottom: 10px;
}

/* ========================================================= */
/* HUD EDITOR                                                 */
/* ========================================================= */

body.hud-edit-mode {
    background: #777;
}

body.hud-edit-mode #canvas-container {
    filter: grayscale(1);

    opacity: 0.12;
}

body.hud-edit-mode #camera-look-zone {
    pointer-events: none;
}

body.hud-edit-mode .hud-element {
    outline: 2px dashed #6cf;

    cursor: grab;

    touch-action: none;
}

/*
 * Джойстик в режиме редактора не должен двигать игрока.
 * Сам элемент при этом остаётся доступным для перемещения
 * редактором HUD.
 */

body.hud-edit-mode #joystick-zone {
    touch-action: none;
}

/* ========================================================= */
/* HUD                                                         */
/* ========================================================= */

#hud-scalable-wrapper {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 10;
}

.hud-element {
    position: absolute;

    pointer-events: auto;
}

.hud-stat-box {
    background: rgba(45,45,45,0.8);

    border: 1px solid #555;

    padding: 8px 15px;

    border-radius: 6px;

    display: flex;

    flex-direction: column;
}

.hud-stat-box span:first-child {
    font-size: 11px;

    color: #aaa;

    text-transform: uppercase;
}

.hud-stat-box span:last-child {
    font-size: 22px;

    color: #fff;

    font-weight: bold;
}

#hud-hp {
    bottom: 20px;
    left: 20px;
}

#hud-armor {
    bottom: 20px;
    left: 120px;
}

#hud-ammo {
    bottom: 20px;
    right: 20px;

    text-align: right;
}

/* ========================================================= */
/* ИГРОВЫЕ КНОПКИ                                             */
/* ========================================================= */

.btn-game {
    width: 65px;
    height: 65px;

    background: rgba(58,58,58,0.6);

    border: 1px solid #666;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    color: #fff;

    -webkit-tap-highlight-color: transparent;

    touch-action: none;
}

.btn-game:active {
    background: rgba(80,80,80,0.8);
}

.btn-game .svg-icon {
    width: 30px;
    height: 30px;
}

/* ========================================================= */
/* FIRE                                                        */
/* ========================================================= */

#btn-fire {
    bottom: 100px;
    right: 40px;

    width: 80px;
    height: 80px;

    font-size: 13px;
}

/* ========================================================= */
/* RELOAD                                                      */
/* ========================================================= */

#btn-reload {
    bottom: 110px;
    right: 140px;

    font-size: 11px;
}

/* ========================================================= */
/* JUMP                                                        */
/* ========================================================= */

#btn-jump {
    bottom: 30px;
    right: 130px;
}

/* ========================================================= */
/* CROUCH                                                      */
/* ========================================================= */

#btn-crouch {
    bottom: 20px;
    right: 210px;
}

/* ========================================================= */
/* JOYSTICK                                                    */
/* ========================================================= */

#joystick-zone {
    bottom: 30px;
    left: 30px;

    width: 120px;
    height: 120px;

    background: rgba(45,45,45,0.5);

    border: 1px solid #666;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    touch-action: none;

    -webkit-tap-highlight-color: transparent;
}

#joystick-stick {
    width: 45px;
    height: 45px;

    background: #888;

    border-radius: 50%;

    pointer-events: none;

    will-change: transform;
}

/* ========================================================= */
/* ПРОФИЛЬ В ИГРЕ                                             */
/* ========================================================= */

#btn-profile {
    top: 20px;
    left: 20px;

    width: 50px;
    height: 50px;

    background: #2d2d2d;

    border: 1px solid #555;

    border-radius: 50%;

    overflow: hidden;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;
}

#btn-profile img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* ========================================================= */
/* ПРИЦЕЛ                                                      */
/* ========================================================= */

#game-crosshair {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    z-index: 10;
}

/* ========================================================= */
/* СЛОТЫ                                                        */
/* ========================================================= */

.weapon-slot {
    width: 48px;
    height: 48px;

    background: rgba(45,45,45,0.7);

    border: 1px solid #555;

    border-radius: 6px;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 11px;

    color: #ccc;
}

#weapon-slots {
    display: flex;

    gap: 6px;

    bottom: 100px;
    right: 20px;
}

/* ========================================================= */
/* СЧЁТ                                                         */
/* ========================================================= */

#match-hud {
    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 10px;

    text-align: center;
}

/* ========================================================= */
/* РАУНД                                                        */
/* ========================================================= */

#round-banner {
    position: absolute;

    top: 35%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: 28px;

    font-weight: bold;

    color: #fff;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.8);

    background:
        rgba(20,20,20,0.6);

    padding: 12px 30px;

    border-radius: 8px;

    opacity: 0;

    transition: opacity 0.4s;

    pointer-events: none;

    z-index: 30;

    white-space: nowrap;
}

/* ========================================================= */
/* КИЛЛФИД                                                     */
/* ========================================================= */

#killfeed-container {
    position: absolute;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    display: flex;

    flex-direction: column;

    gap: 5px;

    pointer-events: none;
}

.killfeed-item {
    background:
        rgba(30,30,30,0.8);

    border: 1px solid #444;

    padding: 5px 15px;

    border-radius: 4px;

    font-size: 13px;

    display: flex;

    align-items: center;

    gap: 10px;

    animation: fadeOut 4s forwards;
}

@keyframes fadeOut {

    0% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

.kf-killer {
    color: #fff;

    font-weight: bold;
}

.kf-weapon {
    color: #888;

    font-size: 11px;
}

.kf-victim {
    color: #ff4d4d;

    font-weight: bold;
}

/* ========================================================= */
/* RESPAWN                                                      */
/* ========================================================= */

#respawn-screen {
    display: none;

    background:
        rgba(20,20,20,0.8);
}

/* ========================================================= */
/* МОБИЛЬНЫЙ ЭКРАН                                             */
/* ========================================================= */

@media (max-width: 700px) {

    .auth-container {
        padding: 22px;
    }

    #hud-hp {
        left: 12px;
        bottom: 15px;
    }

    #hud-armor {
        left: 105px;
        bottom: 15px;
    }

    #hud-ammo {
        right: 12px;
        bottom: 15px;
    }

    #joystick-zone {
        left: 20px;
        bottom: 25px;
    }

    #btn-fire {
        right: 20px;
