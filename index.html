<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D PvP Shooter Online - Fixed Map & Net</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="player.js"></script>
    <script src="item.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #e0e8f0; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        
        #hud { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .hud-bar { background: rgba(255, 255, 255, 0.85); padding: 8px 15px; border-radius: 5px; border-left: 5px solid #333; font-weight: bold; font-size: 14px; color: #111; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #hud-hp { border-left-color: #ff3333; }
        #hud-armor { border-left-color: #3333ff; }
        #hud-ammo { position: absolute; bottom: 25px; left: 25px; border-left-color: #ffaa00; z-index: 10; font-size: 18px; pointer-events: none; background: rgba(255, 255, 255, 0.85); color: #111; }
        
        #top-right-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 40; }
        #kills-counter { background: rgba(255, 255, 255, 0.85); border: 2px solid #ff0055; color: #111; font-weight: bold; padding: 8px 15px; border-radius: 5px; font-size: 14px; }
        #btn-fullscreen { background: #111; color: #fff; border: 1px solid #fff; font-weight: bold; padding: 8px 15px; border-radius: 5px; font-size: 12px; cursor: pointer; }

        #leaderboard-screen, #voting-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #111; display: none; }
        .vote-btn { background: #eee; border: 2px solid #aaa; color: #111; padding: 12px 30px; margin: 10px; font-size: 18px; border-radius: 8px; pointer-events: auto; font-weight: bold; }
        .vote-btn:active { background: #ff0055; color: white; border-color: #fff; }

        #reticle { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #reticle::before, #reticle::after { content: ''; position: absolute; background: rgba(255,0,85,0.9); }
        #reticle::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #reticle::after { top: 0; left: 6px; width: 2px; height: 14px; }

        #death-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 50, 50, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; color: white; display: none; }
        #respawn-btn { background: #111; color: #fff; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; pointer-events: auto; }

        .touch-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 20px; pointer-events: none; z-index: 20; }
        .zone { width: 38%; height: 85%; background: rgba(0,0,0,0.02); border: 1px dashed rgba(0,0,0,0.1); border-radius: 20px; pointer-events: auto; position: relative; }
        
        .action-container { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; z-index: 30; }
        .circle-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #111; color: #111; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btn-shoot { width: 85px; height: 85px; background: linear-gradient(135deg, #ff0055, #cc0044); color: white; border-color: white; font-size: 16px; box-shadow: 0 6px 12px rgba(255, 0, 85, 0.4); }
        
        .label { position: absolute; top: 10px; left: 10px; color: rgba(0, 0, 0, 0.4); font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="reticle"></div>
        
        <div id="hud">
            <div class="hud-bar" id="hud-hp">❤️ HP: 100</div>
            <div class="hud-bar" id="hud-armor">🛡️ ARM: 100</div>
        </div>
        <div class="hud-bar" id="hud-ammo">🔫 Ammo: 30 / 90</div>

        <div id="top-right-controls">
            <div id="kills-counter">💀 Убийства: 0 / 15</div>
            <button id="btn-fullscreen">📺 ЭКРАН</button>
        </div>

        <div class="touch-container">
            <div class="zone" id="move-pad"><span class="label">Ходьба</span></div>
            <div class="zone" id="look-pad"><span class="label">Обзор</span></div>
        </div>

        <div class="action-container">
            <div class="circle-btn" id="btn-shoot">ОГОНЬ</div>
            <div class="circle-btn" id="btn-reload">🔄 ПЕРЕЗР.</div>
            <div class="circle-btn" id="btn-jump">🚀 ПРЫЖОК</div>
        </div>

        <div id="death-screen">
            <h1 style="font-size: 40px; margin-bottom: 20px;">ВЫ ПОГИБЛИ</h1>
            <button id="respawn-btn">РЕСПАВН</button>
        </div>

        <div id="leaderboard-screen">
            <h1 style="color: #ff0055; margin-bottom: 15px;">МАТЧ ОКОНЧЕН</h1>
            <div id="leaderboard-list" style="font-size: 20px; line-height: 2; margin-bottom: 30px;"></div>
        </div>

        <div id="voting-screen">
            <h2>ВЫБЕРИТЕ СЛЕДУЮЩУЮ КАРТУ</h2>
            <button class="vote-btn" onclick="voteForMap('arena')">[ АРЕНА ] (<span id="v-arena">0</span>)</button>
            <button class="vote-btn" onclick="voteForMap('factory')">[ ЗАВОД ] (<span id="v-factory">0</span>)</button>
            <button class="vote-btn" onclick="voteForMap('city')">[ ГОРОД ] (<span id="v-city">0</span>)</button>
        </div>
    </div>

    <script>
        const socket = io('https://pvp-arena-online.onrender.com'); 

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdce6f0); 
        scene.fog = new THREE.FogExp2(0xdce6f0, 0.015); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Устанавливаем базовую позицию игрока до подключения к сети
        camera.position.set(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        document.getElementById('game-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let hp = 100, armor = 100, ammo = 30, reserveAmmo = 90, kills = 0;
        const MAX_RESERVE_AMMO = 120;

        let isDead = false, isReloading = false, currentMap = 'arena';
        let moveInput = { x: 0, y: 0 }, rotY = 0, rotX = 0, verticalVelocity = 0, isGrounded = true;
        const opponents = {};
        
        let shootInterval = null;
        let isShootingPressed = false;
        let supplyCrates = [];
        let wallMeshes = [];
        const wallSize = 4;

        // Сетевые настройки (Tick Rate)
        let lastNetUpdate = 0;
        const netTickRate = 1000 / 30; // 30 сетевых тиков в секунду

        // Создаем пол
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI/2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Создаем сетку на полу
        const grid = new THREE.GridHelper(80, 40, 0xbbbbbb, 0xdddddd); 
        grid.position.y = 0.01;
        scene.add(grid);

        // Функция жесткого создания стен
        function buildMap(mapName) {
            wallMeshes.forEach(w => scene.remove(w));
            wallMeshes = [];
            
            let wallColor = 0x4a90e2; 
            if(mapName === 'factory') wallColor = 0x7c8c9c; 
            if(mapName === 'city') wallColor = 0xe2a04a; 

            const boxGeo = new THREE.BoxGeometry(wallSize, wallSize, wallSize);
            const boxMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.4 });

            for(let i = 0; i < 12; i++) {
                const wall = new THREE.Mesh(boxGeo, boxMat);
                let angle = (i / 12) * Math.PI * 2;
                let radius = 15 + Math.sin(i) * 5;
                
                wall.position.set(Math.cos(angle) * radius, wallSize/2, Math.sin(angle) * radius);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                
                wallMeshes.push(wall);
            }
            respawnSupplyCrates();
        }

        // Спавн ящиков снабжения из item.js
        function respawnSupplyCrates() {
            supplyCrates.forEach(crate => scene.remove(crate));
            supplyCrates = [];

            const cratePositions = [
                {x: -12, z: -12},
                {x: 15, z: 10},
                {x: 0, z: -20}
            ];

            cratePositions.forEach(pos => {
                const container = new THREE.Group();
                container.position.set(pos.x, 0.4, pos.z);

                // Создаем 3D армейский ящик из файла item.js
                const supplyBox = createSupplyBoxModel();
                container.add(supplyBox);

                scene.add(container);
                supplyCrates.push(container);
            });
        }

        // ВЫЗЫВАЕМ СТРОИТЕЛЬСТВО КАРТЫ СРАЗУ (баг устранен)
        buildMap('arena');

        // Авто-переспавн ящиков каждые
