<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D PvP Cyber Arena Online</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h2>Вход в кибер-арену</h2>
            <input type="text" id="input-nick" class="auth-input" placeholder="Твой Никнейм" maxlength="12">
            <input type="password" id="input-pass" class="auth-input" placeholder="Пароль" maxlength="16">
            <button id="btn-auth" class="auth-btn">Войти / Создать</button>
            <div id="auth-status">Подключение к серверу...</div>
        </div>
    </div>

    <div id="respawn-screen">
        <h1 style="color: #ef4444;">ТЕБЯ УБИЛИ!</h1>
        <button id="btn-respawn" class="auth-btn" style="width: auto; padding: 15px 40px;">Возродиться</button>
    </div>

    <div id="settings-panel">
        <h3>⚙️ Настройки игры</h3>
        
        <div class="setting-item">
            <span>Чувствительность (<span id="setting-sens-value">5.0</span>)</span>
            <input type="range" id="setting-sens" min="1" max="15" step="0.5" value="5">
        </div>
        
        <div class="setting-item">
            <span>Инверсия мыши (Y)</span>
            <input type="checkbox" id="setting-invert">
        </div>

        <div class="setting-item">
            <span>Цвет прицела</span>
            <select id="setting-color">
                <option value="#00ffcc">Бирюзовый</option>
                <option value="#ef4444">Красный</option>
                <option value="#10b981">Зеленый</option>
                <option value="#eab308">Желтый</option>
                <option value="#ffffff">Белый</option>
            </select>
        </div>

        <div class="setting-item">
            <span>Размер прицела</span>
            <input type="range" id="setting-size" min="6" max="24" step="2" value="10">
        </div>

        <div class="setting-item">
            <span>Атмосферный Туман</span>
            <input type="checkbox" id="setting-fog" checked>
        </div>

        <button id="btn-leave-match" class="panel-btn">🚪 Выйти в меню (Покинуть матч)</button>

        <div class="panel-grid-buttons">
            <button id="btn-custom-layout" class="panel-btn">✏️ Изменить раскладку HUD</button>
            <button id="btn-save-settings" class="panel-btn">Сохранить</button>
            <button id="btn-close-settings" class="panel-btn">Отмена</button>
            <button id="btn-reset-all" class="panel-btn">🚨 Полный сброс данных</button>
        </div>
    </div>

    <div id="layout-edit-subpanel">
        <p style="margin: 0 0 8px 0; font-size: 13px; font-weight: bold; color: #eab308;">🛠️ Режим редактирования кнопок</p>
        <button id="btn-save-layout" class="panel-btn" style="background:#10b981; color:white; padding: 6px 15px;">Готово</button>
    </div>

    <div id="hud">
        <div id="hud-hp" class="hud-bar">❤️ HP: 100</div>
        <div id="hud-armor" class="hud-bar">🛡️ Броня: 0</div>
        <div id="hud-ammo" class="hud-bar">🔫 Патроны: 30 / 120</div>
    </div>

    <div id="game-timer">03:00</div>

    <div id="top-right-controls">
        <div id="kills-counter">💀 Убийства: 0</div>
        <div class="control-row">
            <button id="btn-settings" class="small-btn">⚙️ НАСТРОЙКИ</button>
            <button id="btn-fullscreen" class="small-btn">📺 ЭКРАН</button>
        </div>
    </div>

    <div id="crosshair"></div>
    
    <div id="joystick-zone" class="draggable"><div id="joystick-stick"></div></div>
    <button id="btn-fire" class="btn-action draggable"></button>
    <button id="btn-jump" class="btn-action draggable"></button>
    <button id="btn-crouch" class="btn-action draggable"></button>
    <button id="btn-reload" class="btn-action draggable"></button>

    <div id="canvas-container"></div>

    <script src="js/settings.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
