<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D PvP Cyber Arena Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-screen {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            text-align: center;
            width: 85%;
            max-width: 320px;
            backdrop-filter: blur(10px);
        }

        .auth-container h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }

        .auth-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff0055, #ff00aa);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: 0.2s;
        }

        .auth-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(255, 0, 85, 0.2);
        }

        #auth-status {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС (HUD) --- */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hud-bar {
            background: rgba(15, 23, 42, 0.75);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            border-left: 4px solid #fff;
            backdrop-filter: blur(4px);
            min-width: 110px;
        }

        #hud-hp { border-left-color: #ef4444; color: #fca5a5; }
        #hud-armor { border-left-color: #3b82f6; color: #93c5fd; }
        #hud-ammo { border-left-color: #eab308; color: #fef08a; }

        #top-right-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        #game-timer {
            background: rgba(10, 16, 30, 0.85);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        #kills-counter {
            background: rgba(15, 23, 42, 0.75);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #38bdf8;
        }

        #btn-fullscreen {
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }

        /* КРЕСТИК ПРИЦЕЛА */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }

        /* --- СЕНСОРНОЕ УПРАВЛЕНИЕ --- */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            z-index: 20;
        }

        #joystick-stick {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        #action-buttons {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 20;
            display: grid;
            grid-template-areas: 
                ". fire ."
                "reload fire jump";
            gap: 12px;
        }

        .btn-action {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        #btn-fire {
            grid-area: fire;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
            border: 2px solid #f87171;
            font-size: 15px;
        }
        #btn-reload { grid-area: reload; background: #475569; border: 1px solid #64748b; }
        #btn-jump { grid-area: jump; background: #065f46; border: 1px solid #059669; }

        /* ЭКРАН СМЕРТИ */
        #respawn-screen {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            backdrop-filter: blur(6px);
        }

        /* ТАБЛИЦА ЛИДЕРОВ В КОНЦЕ МАТЧА */
        #match-end-screen {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 6, 23, 0.95);
            z-index: 60;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .leaderboard-table {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #eab308;
            min-width: 280px;
            margin: 15px 0;
        }
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        /* ТЕКСТОВЫЕ УВЕДОМЛЕНИЯ О КИЛЛАХ */
        #kill-feed {
            position: absolute;
            top: 150px;
            right: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: none;
        }
        .kill-msg {
            background: rgba(0,0,0,0.6);
            color: #f87171;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            animation: fadeOutMsg 3s forwards;
        }
        @keyframes fadeOutMsg { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h2>Вход в кибер-арену</h2>
            <input type="text" id="input-nick" class="auth-input" placeholder="Твой Никнейм" maxlength="12">
            <input type="password" id="input-pass" class="auth-input" placeholder="Пароль" maxlength="16">
            <button id="btn-auth" class="auth-btn">Войти / Создать</button>
            <div id="auth-status">Ник от 3 символов, пароль от 4!</div>
        </div>
    </div>

    <div id="respawn-screen">
        <h1 style="color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.5);">ТЕБЯ УБИЛИ!</h1>
        <button id="btn-respawn" class="auth-btn" style="width: auto; padding: 15px 40px;">Возродиться</button>
    </div>

    <div id="match-end-screen">
        <h1 style="color: #eab308; text-shadow: 0 0 15px rgba(234,179,8,0.5);">РАУНД ЗАВЕРШЕН!</h1>
        <h3>Победители матча:</h3>
        <div id="leaderboard-content" class="leaderboard-table"></div>
        <p style="color: #94a3b8; font-size: 14px;">Новый раунд начнется через несколько секунд...</p>
    </div>

    <div id="hud">
        <div id="hud-hp" class="hud-bar">❤️ HP: 100</div>
        <div id="hud-armor" class="hud-bar">🛡️ ARM: 100</div>
        <div id="hud-ammo" class="hud-bar">🔫 Патроны: 30 / 90</div>
    </div>

    <div id="top-right-controls">
        <div id="game-timer">⏱️ Время: 3:00</div>
        <div id="kills-counter">💀 Убийства: 0</div>
        <button id="btn-fullscreen">📺 ЭКРАН</button>
    </div>

    <div id="kill-feed"></div>
    <div id="crosshair"></div>

    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    
    <div id="action-buttons">
        <button id="btn-fire" class="btn-action">Огонь</button>
        <button id="btn-reload" class="btn-action">Перезр.</button>
        <button id="btn-jump" class="btn-action">Прыжок</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // НАСТРОЙКА СВЯЗИ С СЕРВЕРОМ RENDER
        const SERVER_URL = "https://pvp-arena-online.onrender.com"; // ЗАМЕНИ НА СВОЙ URL ОТ RENDER!
        const socket = io(SERVER_URL);

        // Игровые переменные локального игрока
        let myNick = "", myPass = "";
        let hp = 100, armor = 100, kills = 0;
        let ammo = 30, reserveAmmo = 90, isReloading = false;
        let myId = null;

        // Переменные для 3D графики
        let scene, camera, renderer;
        let playerMesh;
        let remotePlayers = {};
        let mapObjects = [];

        // Физика и управление движением
        let moveDirection = { forward: 0, right: 0 };
        let playerVelocity = new THREE.Vector3();
        let isGrounded = true;
        const GRAVITY = 28;
        const JUMP_FORCE = 11;
        const MOVE_SPEED = 14;

        // Управление камерой вращением (Touch поворот экрана)
        let pitchObject = new THREE.Object3D();
        let yawObject = new THREE.Object3D();
        let lookSpeed = 0.0035;

        // Инициализация при первой загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            initEngine();
            setupControls();
            
            // Автоматическое заполнение данных из памяти телефона
            if(localStorage.getItem('cyber_nick') && localStorage.getItem('cyber_pass')) {
                document.getElementById('input-nick').value = localStorage.getItem('cyber_nick');
                document.getElementById('input-pass').value = localStorage.getItem('cyber_pass');
            }
        });

        // ИНИЦИАЛИЗАЦИЯ THREE.JS КЛИЕНТА
        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Настройка контейнеров вращения взгляда FPS
            pitchObject.add(camera);
            yawObject.add(pitchObject);
            scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Освещение сцены
            let ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            let dirLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            buildMap();
            animate();
        }

        // СТРОИТЕЛЬСТВО БОЛЬШОЙ ИНТЕРЕСНОЙ КАРТЫ ДЛЯ МАТЧА
        function buildMap() {
            // Очищаем старые объекты карты, если они были
            mapObjects.forEach(obj => scene.remove(obj));
            mapObjects = [];

            // Огромный футуристический пол (100х100 метров)
            let floorGeo = new THREE.PlaneGeometry(100, 100);
            let floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
            let floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            mapObjects.push(floor);

            // Сетка арены
            let grid = new THREE.GridHelper(100, 50, 0x38bdf8, 0x1f2937);
            grid.position.y = 0.01;
            scene.add(grid);
            mapObjects.push(grid);

            // Генерация укрытий: Башни, перегородки, блоки
            createBoxObstacle(0, 3, 0, 12, 6, 2, 0x334155); // Центр арены
            createBoxObstacle(-15, 4, 15, 6, 8, 6, 0x0284c7); // Башня 1
            createBoxObstacle(15, 4, -15, 6, 8, 6, 0x0284c7); // Башня 2
            createBoxObstacle(25, 2, 20, 8, 4, 2, 0x475569);  // Стена справа
            createBoxObstacle(-25, 2, -20, 8, 4, 2, 0x475569); // Стена слева
        }

        function createBoxObstacle(x, y, z, w, h, d, colorHex) {
            let geo = new THREE.BoxGeometry(w, h, d);
            let mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
            let mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            mapObjects.push(mesh);
        }

        // СИСТЕМА АВТОРИЗАЦИИ ЧЕРЕЗ СЕРВЕР
        document.getElementById('btn-auth').addEventListener('click', () => {
            let nickname = document.getElementById('input-nick').value.trim();
            let password = document.getElementById('input-pass').value.trim();

            if(nickname.length < 3 || password.length < 4) {
                document.getElementById('auth-status').innerText = "Слишком короткий ник или пароль!";
                return;
            }

            document.getElementById('btn-auth').innerText = "Отправка данных...";
            myNick = nickname;
            myPass = password;

            // Отправляем пакет запроса на сервер
            socket.emit('playerAuth', { nick: nickname, pass: password });
        });

        socket.on('authSuccess', (data) => {
            // Сохраняем в память телефона, чтобы не вводить повторно
            localStorage.setItem('cyber_nick', data.nick);
            localStorage.setItem('cyber_pass', data.pass);
            
            document.getElementById('auth-screen').style.display = 'none';
            myId = socket.id;
        });

        socket.on('authFailed', (errorMsg) => {
            document.getElementById('btn-auth').innerText = "Войти / Создать";
            document.getElementById('auth-status').innerText = errorMsg;
        });

        socket.on('init', (spawnPos) => {
            yawObject.position.set(spawnPos.x, 1.7, spawnPos.z);
            hp = 100;
            armor = 100;
            ammo = 30;
            updateHUD();
            document.getElementById('respawn-screen').style.display = 'none';
        });

        // СИНХРОНИЗАЦИЯ ТАЙМЕРА РАУНДА ОТ СЕРВЕРА
        socket.on('timerUpdate', (data) => {
            const minutes = Math.floor(data.timeLeft / 60);
            const seconds = data.timeLeft % 60;
            const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('game-timer').innerText = `⏱️ Время: ${minutes}:${formattedSeconds}`;
        });

        // ОБНОВЛЕНИЕ КООРДИНАТ ВСЕХ ВРАГОВ НА КАРТЕ
        socket.on('updatePlayers', (serverPlayers) => {
            for (let id in serverPlayers) {
                if (id === socket.id) {
                    kills = serverPlayers[id].kills;
                    updateHUD();
                    continue;
                }

                let pData = serverPlayers[id];

                if (!remotePlayers[id] && pData.hp > 0) {
                    // Создаем тело врага с разделением на Хедшот зону
                    let group = new THREE.Group();

                    // Тело (капсула)
                    let bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 12);
                    let bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
                    let bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
                    bodyMesh.position.y = 0.7;
                    bodyMesh.userData = { targetId: id, zone: 'body' };
                    group.add(bodyMesh);

                    // Голова (сфера для хедшота)
                    let headGeo = new THREE.SphereGeometry(0.3, 12, 12);
                    let headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                    let headMesh = new THREE.Mesh(headGeo, headMat);
                    headMesh.position.y = 1.6;
                    headMesh.userData = { targetId: id, zone: 'head' };
                    group.add(headMesh);

                    scene.add(group);
                    remotePlayers[id] = group;
                }

                if (remotePlayers[id]) {
                    if (pData.hp <= 0) {
                        scene.remove(remotePlayers[id]);
                        delete remotePlayers[id];
                    } else {
                        remotePlayers[id].position.set(pData.x, 0, pData.z);
                        remotePlayers[id].rotation.y = pData.rotY;
                    }
                }
            }

            // Удаляем ушедших игроков
            for (let id in remotePlayers) {
                if (!serverPlayers[id]) {
                    scene.remove(remotePlayers[id]);
                    delete remotePlayers[id];
                }
            }
        });

        // ОБРАБОТКА СТРЕЛЬБЫ И СИСТЕМЫ ХЕДШОТОВ (RAYCASTING)
        function performShot() {
            if (ammo <= 0 || isReloading || hp <= 0) return;

            ammo--;
            updateHUD();

            // Создаем луч из центра экрана вперед
            let raycaster = new THREE.Raycaster();
            let centerScreen = new THREE.Vector2(0, 0); // Центр экрана в WebGL
            raycaster.setFromCamera(centerScreen, camera);

            // Получаем массив всех объектов по траектории луча
            let targets = [];
            for (let id in remotePlayers) {
                targets.push(...remotePlayers[id].children);
            }

            let intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                let hitData = hitObject.userData; // Читаем зону (body или head)

                // Отправляем урон на сервер с фиксацией хедшота
                socket.emit('playerHit', { targetId: hitData.targetId, zone: hitData.zone });
            }
        }

        // ПЕРЕЗАРЯДКА ОРУЖИЯ
        function startReload() {
            if (isReloading || ammo === 30 || reserveAmmo <= 0) return;
            isReloading = true;
            updateHUD();

            setTimeout(() => {
                let needed = 30 - ammo;
                let transfer = Math.min(needed, reserveAmmo);
                ammo += transfer;
                reserveAmmo -= transfer;
                isReloading = false;
                updateHUD();
            }, 1500);
        }

        // ОБНОВЛЕНИЕ HUD НА ЭКРАНЕ ТЕЛЕФОНА
        function updateHUD() {
            document.getElementById('hud-hp').innerText = `❤️ HP: ${hp}`;
            document.getElementById('hud-armor').innerText = `🛡️ ARM: ${armor}`;
            document.getElementById('hud-ammo').innerText = isReloading ? `🔄 ПЕРЕЗАРЯДКА...` : `🔫 Патроны: ${ammo} / ${reserveAmmo}`;
            document.getElementById('kills-counter').innerText = `💀 Убийства: ${kills}`;
        }

        // ФИНАЛ МАТЧА ПО ТАЙМЕРУ
        socket.on('matchEnd', (data) => {
            let container = document.getElementById('leaderboard-content');
            container.innerHTML = "";
            
            data.leaderboard.forEach((p, index) => {
                container.innerHTML += `
                    <div class="leaderboard-row">
                        <span>#${index + 1} ${p.nick}</span>
                        <span style="color: #38bdf8; font-weight: bold;">${p.kills} фрагов</span>
                    </div>`;
            });

            document.getElementById('match-end-screen').style.display = 'flex';
        });

        socket.on('mapChange', (newMapName) => {
            document.getElementById('match-end-screen').style.display = 'none';
            buildMap(); // Перестраиваем арену, если сервер сменил карту
        });

        // СМЕРТЬ И РЕСПАВН
        socket.on('updatePlayers', (serverPlayers) => {
            if (myId && serverPlayers[myId] && serverPlayers[myId].hp <= 0 && hp > 0) {
                hp = 0;
                updateHUD();
                document.getElementById('respawn-screen').style.display = 'flex';
            }
        });

        document.getElementById('btn-respawn').addEventListener('click', () => {
            socket.emit('requestRespawn');
        });

        // НАСТРОЙКА СЕНСОРНОГО УПРАВЛЕНИЯ (ДЖОЙСТИК + КНОПКИ)
        function setupControls() {
            // Кнопки действий
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); performShot(); });
            document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); startReload(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if(isGrounded) playerVelocity.y = JUMP_FORCE; });

            // Полноэкранный режим для удобства
            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            });

            // Реализация Локального сенсорного джойстика движения
            let joystickZone = document.getElementById('joystick-zone');
            let stick = document.getElementById('joystick-stick');
            let maxRadius = 40;

            joystickZone.addEventListener('touchstart', handleJoystick, {passive: false});
            joystickZone.addEventListener('touchmove', handleJoystick, {passive: false});
            joystickZone.addEventListener('touchend', () => {
                stick.style.transform = `translate(0px, 0px)`;
                moveDirection.forward = 0;
                moveDirection.right = 0;
            });

            function handleJoystick(e) {
                e.preventDefault();
                let touch = e.touches[0];
                let rect = joystickZone.getBoundingClientRect();
                let centerX = rect.left + rect.width / 2;
                let centerY = rect.top + rect.height / 2;

                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;
                let distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);

                if (distance > maxRadius) {
                    deltaX = (deltaX / distance) * maxRadius;
                    deltaY = (deltaY / distance) * maxRadius;
                }

                stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

                // Переводим смещение стика в коэффициенты движения (-1 до 1)
                moveDirection.forward = -(deltaY / maxRadius);
                moveDirection.right = (deltaX / maxRadius);
            }

            // Поворот камеры свайпами по правой части экрана
            let lastTouchX = null, lastTouchY = null;
            window.addEventListener('touchstart', (e) => {
                if(e.touches[0].clientX > window.innerWidth / 2) {
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if(lastTouchX === null || lastTouchY === null) return;
                
                let touch = e.touches[0];
                let movementX = touch.clientX - lastTouchX;
                let movementY = touch.clientY - lastTouchY;

                yawObject.rotation.y -= movementX * lookSpeed;
                pitchObject.rotation.x -= movementY * lookSpeed;
                pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x));

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }, {passive: false});

            window.addEventListener('touchend', () => { lastTouchX = null; lastTouchY = null; });
        }

        // ГЛАВНЫЙ ЦИКЛ РЕНДЕРА И ФИЗИКИ ИГРЫ
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            if (delta > 0.1) delta = 0.1; // Защита от просадок кадров

            if (myId && hp > 0) {
                // Применение гравитации
                playerVelocity.y -= GRAVITY * delta;

                // Движение вперед/назад и в бока с учетом поворота взгляда
                let forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
                let sideVector = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);

                let moveX = (forwardVector.x * moveDirection.forward + sideVector.x * moveDirection.right) * MOVE_SPEED;
                let moveZ = (forwardVector.z * moveDirection.forward + sideVector.z * moveDirection.right) * MOVE_SPEED;

                yawObject.position.x += moveX * delta;
                yawObject.position.z += moveZ * delta;
                yawObject.position.y += playerVelocity.y * delta;

                // Базовая коллизия с землей
                if (yawObject.position.y <= 1.7) {
                    playerVelocity.y = 0;
                    yawObject.position.y = 1.7;
                    isGrounded = true;
                } else {
                    isGrounded = false;
                }

                // Каждую итерацию шлем координаты своего движения серверу
                socket.emit('playerMove', {
                    x: yawObject.position.x,
                    z: yawObject.position.z,
                    rotY: yawObject.rotation.y
                });
            }

            renderer.render(scene, camera);
        }

        // Адаптация экрана при изменении ориентации телефона
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
