<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D PvP Shooter Online - Bright Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #e0e8f0; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        
        /* Игровой интерфейс (HUD) */
        #hud { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .hud-bar { background: rgba(255, 255, 255, 0.85); padding: 8px 15px; border-radius: 5px; border-left: 5px solid #333; font-weight: bold; font-size: 14px; color: #111; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #hud-hp { border-left-color: #ff3333; }
        #hud-armor { border-left-color: #3333ff; }
        #hud-ammo { position: absolute; bottom: 25px; left: 25px; border-left-color: #ffaa00; z-index: 10; font-size: 18px; pointer-events: none; background: rgba(255, 255, 255, 0.85); color: #111; }
        
        #kills-counter { position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.85); border: 2px solid #ff0055; color: #111; }
        #leaderboard-screen, #voting-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #111; display: none; }
        .vote-btn { background: #eee; border: 2px solid #aaa; color: #111; padding: 12px 30px; margin: 10px; font-size: 18px; border-radius: 8px; pointer-events: auto; font-weight: bold; }
        .vote-btn:active { background: #ff0055; color: white; border-color: #fff; }

        /* Прицел */
        #reticle { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #reticle::before, #reticle::after { content: ''; position: absolute; background: rgba(255,0,85,0.9); }
        #reticle::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #reticle::after { top: 0; left: 6px; width: 2px; height: 14px; }

        /* Экран смерти */
        #death-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 50, 50, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; color: white; display: none; }
        #respawn-btn { background: #111; color: #fff; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; pointer-events: auto; }

        /* Сенсоры под мобилки */
        .touch-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 20px; pointer-events: none; z-index: 20; }
        .zone { width: 38%; height: 85%; background: rgba(0,0,0,0.02); border: 1px dashed rgba(0,0,0,0.1); border-radius: 20px; pointer-events: auto; position: relative; }
        
        .action-container { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; z-index: 30; }
        .circle-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #111; color: #111; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btn-shoot { width: 85px; height: 85px; background: linear-gradient(135deg, #ff0055, #cc0044); color: white; border-color: white; font-size: 16px; box-shadow: 0 6px 12px rgba(255, 0, 85, 0.4); }
        
        .label { position: absolute; top: 10px; left: 10px; color: rgba(0, 0, 0, 0.4); font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="reticle"></div>
        
        <div id="hud">
            <div class="hud-bar" id="hud-hp">❤️ HP: 100</div>
            <div class="hud-bar" id="hud-armor">🛡️ ARM: 100</div>
            <div class="hud-bar" id="kills-counter">💀 Убийства: 0 / 15</div>
        </div>
        <div class="hud-bar" id="hud-ammo">🔫 Ammo: 30 / 90</div>

        <div class="touch-container">
            <div class="zone" id="move-pad"><span class="label">Ходьба</span></div>
            <div class="zone" id="look-pad"><span class="label">Обзор</span></div>
        </div>

        <div class="action-container">
            <div class="circle-btn" id="btn-shoot">ОГОНЬ</div>
            <div class="circle-btn" id="btn-reload">🔄 ПЕРЕЗР.</div>
            <div class="circle-btn" id="btn-jump">🚀 ПРЫЖОК</div>
        </div>

        <div id="death-screen">
            <h1 style="font-size: 40px; margin-bottom: 20px;">ВЫ ПОГИБЛИ</h1>
            <button id="respawn-btn">РЕСПАВН</button>
        </div>

        <div id="leaderboard-screen">
            <h1 style="color: #ff0055; margin-bottom: 15px;">МАТЧ ОКОНЧЕН</h1>
            <div id="leaderboard-list" style="font-size: 20px; line-height: 2; margin-bottom: 30px;"></div>
        </div>

        <div id="voting-screen">
            <h2>ВЫБЕРИТЕ СЛЕДУЮЩУЮ КАРТУ</h2>
            <button class="vote-btn" onclick="voteForMap('arena')">[ АРЕНА ] (<span id="v-arena">0</span>)</button>
            <button class="vote-btn" onclick="voteForMap('factory')">[ ЗАВОД ] (<span id="v-factory">0</span>)</button>
            <button class="vote-btn" onclick="voteForMap('city')">[ ГОРОД ] (<span id="v-city">0</span>)</button>
        </div>
    </div>

    <script>
        // Твоя рабочая ссылка на Render сервер установлена здесь:
        const socket = io('https://pvp-arena-online.onrender.com'); 

        // --- 1. СВЕТЛАЯ КАРТА (Инициализация сцены) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdce6f0); 
        scene.fog = new THREE.FogExp2(0xdce6f0, 0.015); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        document.getElementById('game-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let hp = 100, armor = 100, ammo = 30, reserveAmmo = 90, kills = 0;
        let isDead = false, currentMap = 'arena';
        let moveInput = { x: 0, y: 0 }, rotY = 0, rotX = 0, verticalVelocity = 0, isGrounded = true;
        const opponents = {};

        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI/2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        const grid = new THREE.GridHelper(80, 40, 0xbbbbbb, 0xdddddd); 
        grid.position.y = 0.01;
        scene.add(grid);

        // --- 2. КОЛЛИЗИЯ ОБЪЕКТОВ (Генерация стен и укрытий) ---
        let wallMeshes = [];
        const wallSize = 4;

        function buildMap(mapName) {
            wallMeshes.forEach(w => scene.remove(w));
            wallMeshes = [];
            
            let wallColor = 0x4a90e2; 
            if(mapName === 'factory') wallColor = 0x7c8c9c; 
            if(mapName === 'city') wallColor = 0xe2a04a; 

            const boxGeo = new THREE.BoxGeometry(wallSize, wallSize, wallSize);
            const boxMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.4 });

            for(let i = 0; i < 12; i++) {
                const wall = new THREE.Mesh(boxGeo, boxMat);
                let angle = (i / 12) * Math.PI * 2;
                let radius = 15 + Math.sin(i) * 5;
                
                wall.position.set(Math.cos(angle) * radius, wallSize/2, Math.sin(angle) * radius);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                
                wallMeshes.push(wall);
            }
        }
        buildMap('arena');

        // --- 3. СЛОЖНЫЕ МОДЕЛЬКИ ПЕРСОНАЖЕЙ ---
        function createCharacterModel() {
            const group = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.2, 1.4, 0.7);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.3, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.2;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.1;
            head.castShadow = true;
            group.add(head);

            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1.1);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.5, 1.1, -0.5); 
            group.add(gun);

            return group;
        }

        setupJoystick('move-pad', (dx, dy) => { moveInput.x = dx; moveInput.y = dy; });
        setupLookPad('look-pad');

        function setupJoystick(id, callback) {
            const el = document.getElementById(id);
            let tid = null, sx = 0, sy = 0;
            el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tid = t.identifier; sx = t.clientX; sy = t.clientY; });
            el.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === tid) {
                        let dx = (t.clientX - sx)/50; let dy = (t.clientY - sy)/50;
                        let d = Math.sqrt(dx*dx+dy*dy); if(d>1){dx/=d; dy/=d;}
                        callback(dx, -dy);
                    }
                }
            });
            el.addEventListener('touchend', e => { for(let t of e.changedTouches) { if(t.identifier === tid){ tid=null; callback(0,0); } } });
        }

        function setupLookPad(id) {
            const el = document.getElementById(id);
            let tid = null, lx = 0, ly = 0;
            el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tid = t.identifier; lx = t.clientX; ly = t.clientY; });
            el.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === tid) {
                        rotY -= (t.clientX - lx) * 0.006;
                        rotX -= (t.clientY - ly) * 0.006;
                        rotX = Math.max(-Math.PI/2.4, Math.min(Math.PI/2.4, rotX));
                        lx = t.clientX; ly = t.clientY;
                    }
                }
            });
            el.addEventListener('touchend', e => { for(let t of e.changedTouches) { if(t.identifier === tid) tid=null; } });
        }

        document.getElementById('btn-shoot').addEventListener('touchstart', shootWeapon);
        document.getElementById('btn-reload').addEventListener('touchstart', reloadWeapon);
        document.getElementById('btn-jump').addEventListener('touchstart', () => { if(isGrounded && !isDead) { verticalVelocity = 0.16; isGrounded = false; } });
        document.getElementById('respawn-btn').addEventListener('click', () => { socket.emit('requestRespawn'); document.getElementById('death-screen').style.display = 'none'; isDead = false; });

        function updateHUD() {
            document.getElementById('hud-hp').innerText = `❤️ HP: ${hp}`;
            document.getElementById('hud-armor').innerText = `🛡️ ARM: ${armor}`;
            document.getElementById('hud-ammo').innerText = `🔫 Ammo: ${ammo} / ${reserveAmmo}`;
            document.getElementById('kills-counter').innerText = `💀 Убийства: ${kills} / 15`;
        }

        function shootWeapon() {
            if(ammo <= 0 || isDead) return;
            ammo--;
            updateHUD();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const targets = [];
            Object.values(opponents).forEach(op => {
                op.mesh.children.forEach(child => {
                    child.userData = { id: op.mesh.name, type: child.geometry.type }; 
                    targets.push(child);
                });
            });

            const intersects = raycaster.intersectObjects(targets);
            if(intersects.length > 0) {
                const hitMesh = intersects[0].object;
                let hitZone = 'body';
                if(hitMesh.geometry.type === 'SphereGeometry') hitZone = 'head'; 

                socket.emit('playerHit', { targetId: hitMesh.userData.id, zone: hitZone });
            }
        }

        function reloadWeapon() {
            if(reserveAmmo <= 0 || ammo === 30 || isDead) return;
            let needed = 30 - ammo;
            if(reserveAmmo >= needed) { ammo += needed; reserveAmmo -= needed; } 
            else { ammo += reserveAmmo; reserveAmmo = 0; }
            updateHUD();
        }

        function voteForMap(mapName) { socket.emit('voteMap', mapName); }

        // --- СЕТЕВАЯ СВЯЗЬ ---
        socket.on('init', (data) => { camera.position.set(data.x, 2, data.z); });

        socket.on('updatePlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach(id => {
                if(id === socket.id) {
                    hp = serverPlayers[id].hp;
                    armor = serverPlayers[id].armor;
                    kills = serverPlayers[id].kills;
                    updateHUD();

                    if(hp <= 0 && !isDead) {
                        isDead = true;
                        document.getElementById('death-screen').style.display = 'flex';
                    }
                    return;
                }

                if(!opponents[id]) {
                    const charModel = createCharacterModel();
                    charModel.name = id;
                    scene.add(charModel);
                    opponents[id] = { mesh: charModel };
                }

                opponents[id].mesh.position.set(serverPlayers[id].x, 0, serverPlayers[id].z);
            });

            Object.keys(opponents).forEach(id => {
                if(!serverPlayers[id]) { scene.remove(opponents[id].mesh); delete opponents[id]; }
            });
        });

        socket.on('mapChange', (mapName) => {
            currentMap = mapName;
            buildMap(mapName);
            document.getElementById('voting-screen').style.display = 'none';
            document.getElementById('leaderboard-screen').style.display = 'none';
        });

        socket.on('matchEnd', (data) => {
            document.getElementById('leaderboard-screen').style.display = 'flex';
            let list = document.getElementById('leaderboard-list');
            list.innerHTML = data.leaderboard.map((p, i) => `${i+1}. Игрок [${p.id.substring(0,4)}] — ${p.kills} фрагов`).join('<br>');
            setTimeout(() => { document.getElementById('voting-screen').style.display = 'flex'; }, 4000);
        });

        socket.on('updateVotes', (votes) => {
            document.getElementById('v-arena').innerText = votes.arena || 0;
            document.getElementById('v-factory').innerText = votes.factory || 0;
            document.getElementById('v-city').innerText = votes.city || 0;
        });

        // --- 4. ЦИКЛ ОБНОВЛЕНИЯ И КОЛЛИЗИЙ ---
        function animate() {
            requestAnimationFrame(animate);

            if(!isDead) {
                camera.rotation.order = "YXZ";
                camera.rotation.y = rotY;
                camera.rotation.x = rotX;

                const speed = 0.08;
                let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                let side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                side.y = 0; side.normalize();

                let nextX = camera.position.x + (forward.x * moveInput.y + side.x * moveInput.x) * speed;
                let nextZ = camera.position.z + (forward.z * moveInput.y + side.z * moveInput.x) * speed;

                let playerSize = 0.7; 
                let allowMoveX = true;
                let allowMoveZ = true;

                for (let wall of wallMeshes) {
                    let wX = wall.position.x;
                    let wZ = wall.position.z;
                    let halfWall = wallSize / 2;

                    if (nextX + playerSize > wX - halfWall && nextX - playerSize < wX + halfWall &&
                        camera.position.z + playerSize > wZ - halfWall && camera.position.z - playerSize < wZ + halfWall) {
                        allowMoveX = false;
                    }
                    if (camera.position.x + playerSize > wX - halfWall && camera.position.x - playerSize < wX + halfWall &&
                        nextZ + playerSize > wZ - halfWall && nextZ - playerSize < wZ + halfWall) {
                        allowMoveZ = false;
                    }
                }

                if (allowMoveX) camera.position.x = nextX;
                if (allowMoveZ) camera.position.z = nextZ;

                camera.position.y += verticalVelocity;
                if(camera.position.y > 2) {
                    verticalVelocity -= 0.009;
                } else {
                    camera.position.y = 2;
                    verticalVelocity = 0;
                    isGrounded = true;
                }

                camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
                camera.position.z = Math.max(-38, Math.min(38, camera.position.z));

                socket.emit('playerMove', { x: camera.position.x, z: camera.position.z });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
