<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Кибер Арена</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="damage-flash"></div>

    <div id="damage-indicator"></div>

    <div id="canvas-container"></div>

    <div id="hud-top">
        <div id="hud-hp">❤️ HP: 100</div>
        <div id="hud-armor">🛡️ Броня: 100</div>
        <div id="game-timer">Матч: 03:00</div>
        <div id="kills-counter">💀 Убийства: 0</div>
        <button class="small-btn text-red" onclick="leaveMatch()">Выйти</button>
    </div>

    <div id="hud-bottom">
        <div id="hud-ammo">🔫 Патроны: 30 / 120</div>
    </div>

    <div id="auth-screen" class="overlay">
        <div class="menu-box">
            <h2>КИБЕР АРЕНА 3D</h2>
            <div id="auth-status">Введите ник и пароль для входа</div>
            <input type="text" id="input-nick" placeholder="Ваш никнейм" maxlength="14">
            <input type="password" id="input-pass" placeholder="Пароль">
            <button id="btn-auth" class="menu-btn">Войти / Создать</button>
        </div>
    </div>

    <div id="respawn-screen" class="overlay" style="display: none;">
        <div class="menu-box">
            <h2 class="text-red">ВЫ ПОГИБЛИ</h2>
            <button id="btn-respawn" class="menu-btn">Возродиться</button>
        </div>
    </div>

    <div id="voting-screen" class="overlay" style="display: none;">
        <div class="menu-box border-yellow">
            <h2 class="text-yellow animate-pulse">МАТЧ ЗАВЕРШЕН</h2>
            <p style="margin-bottom: 20px; color: #94a3b8;">Голосование за следующую локацию:</p>
            <div class="vote-row">
                <button class="vote-btn btn-blue" onclick="voteMap('arena')">
                    🏟️ Арена (<span id="vote-arena-count">0</span>)
                </button>
                <button class="vote-btn btn-pink" onclick="voteMap('maze')">
                    🧬 Лабиринт (<span id="vote-maze-count">0</span>)
                </button>
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>

        <button id="btn-reload" class="btn-action"></button>

        <button id="btn-fire" class="btn-action"></button>

        <button id="btn-crouch" class="btn-action"></button>

        <button id="btn-jump" class="btn-action"></button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
