<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>PvP Arena Online v2</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #121212;
    color: #fff;
    font-family: "Segoe UI", Roboto, sans-serif;
}

#canvas-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* =========================================================
   ЗОНА ОБЗОРА КАМЕРЫ
   ========================================================= */

#camera-look-zone {
    position: absolute;
    top: 0;
    right: 0;

    width: 65%;
    height: 100%;

    z-index: 5;

    pointer-events: auto;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

/* =========================================================
   ОБЩИЕ ОКНА
   ========================================================= */

.overlay {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    background: #1e1e1e;

    z-index: 100;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 20px;
}

.auth-container {
    width: 100%;
    max-width: 400px;

    padding: 30px;

    background: #2d2d2d;

    border: 1px solid #444;
    border-radius: 8px;

    text-align: center;

    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}

.auth-container h1 {
    margin-bottom: 20px;

    color: #fff;

    font-size: 24px;
    font-weight: 600;
}

.auth-input {
    width: 100%;

    padding: 14px;

    margin-bottom: 12px;

    background: #1e1e1e;

    border: 1px solid #444;
    border-radius: 6px;

    color: #fff;

    font-size: 15px;

    outline: none;
}

.auth-input:focus {
    border-color: #888;
}

.btn-main {
    width: 100%;

    padding: 14px;

    background: #3a3a3a;

    border: 1px solid #555;
    border-radius: 6px;

    color: #fff;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.btn-main:hover {
    background: #4a4a4a;
}

.btn-main:active {
    transform: scale(.98);
}

/* =========================================================
   HUD
   ========================================================= */

#hud-scalable-wrapper {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 10;

    pointer-events: none;
}

.hud-element {
    position: absolute;
    pointer-events: auto;
}

/* =========================================================
   ПРОФИЛЬ
   ========================================================= */

#btn-profile {
    position: absolute;

    top: 20px;
    left: 20px;

    width: 52px;
    height: 52px;

    padding: 0;

    background: rgba(45, 45, 45, .88);

    border: 1px solid #666;
    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 15;
}

#btn-profile img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================================================
   СЧЁТ КОМАНД
   ========================================================= */

#team-score {
    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    min-width: 120px;

    padding: 7px 14px;

    background: rgba(25, 25, 25, .82);

    border: 1px solid #555;
    border-radius: 8px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    font-size: 17px;
    font-weight: 700;

    pointer-events: none;
}

.team-score-value {
    min-width: 25px;

    text-align: center;
}

.team-score-divider {
    color: #777;
}

/* =========================================================
   МИНИКАРТА
   ========================================================= */

#minimap {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 130px;
    height: 130px;

    background: rgba(20, 20, 20, .78);

    border: 1px solid #666;
    border-radius: 50%;

    overflow: hidden;

    pointer-events: none;
}

#minimap-inner {
    position: absolute;
    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;
}

#minimap-player {
    width: 8px;
    height: 8px;

    background: #fff;

    border-radius: 50%;

    box-shadow: 0 0 8px rgba(255,255,255,.8);
}

.minimap-enemy {
    position: absolute;

    width: 6px;
    height: 6px;

    background: #ff5555;

    border-radius: 50%;
}

/* =========================================================
   HP / ARMOR
   ========================================================= */

.hud-stat-box {
    min-width: 88px;

    padding: 7px 12px;

    background: rgba(45, 45, 45, .82);

    border: 1px solid #555;
    border-radius: 6px;

    display: flex;

    flex-direction: column;
}

.hud-stat-box span:first-child {
    color: #aaa;

    font-size: 10px;

    text-transform: uppercase;
}

.hud-stat-box span:last-child {
    color: #fff;

    font-size: 20px;
    font-weight: bold;
}

#hud-hp {
    left: 20px;
    bottom: 20px;
}

#hud-armor {
    left: 120px;
    bottom: 20px;
}

/* =========================================================
   ПРИЦЕЛ
   ========================================================= */

#game-crosshair {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 6px;
    height: 6px;

    background: #fff;

    border-radius: 50%;

    pointer-events: none;

    z-index: 8;
}

/* =========================================================
   ДЖОЙСТИК
   ========================================================= */

#joystick-zone {
    position: absolute;

    left: 30px;
    bottom: 30px;

    width: 120px;
    height: 120px;

    background: rgba(45, 45, 45, .5);

    border: 1px solid #666;
    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    touch-action: none;
}

#joystick-stick {
    width: 45px;
    height: 45px;

    background: #888;

    border-radius: 50%;

    transition: transform .05s linear;
}

/* =========================================================
   SVG-КНОПКИ
   ========================================================= */

.btn-game {
    width: 64px;
    height: 64px;

    background: rgba(45, 45, 45, .68);

    border: 1px solid #666;
    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    touch-action: none;

    transition:
        transform .08s ease,
        background .08s ease;
}

.btn-game svg {
    width: 30px;
    height: 30px;

    fill: none;
    stroke: #fff;

    stroke-width: 2;

    stroke-linecap: round;
    stroke-linejoin: round;

    pointer-events: none;
}

.btn-game:active {
    transform: scale(.9);

    background: rgba(90, 90, 90, .85);
}

/* =========================================================
   КНОПКИ
   ========================================================= */

#btn-fire {
    right: 35px;
    bottom: 95px;

    width: 78px;
    height: 78px;
}

#btn-reload {
    right: 135px;
    bottom: 105px;
}

#btn-jump {
    right: 125px;
    bottom: 25px;
}

#btn-crouch {
    right: 205px;
    bottom: 18px;
}

/* =========================================================
   KILLFEED
   ========================================================= */

#killfeed-container {
    position: absolute;

    top: 85px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    flex-direction: column;

    gap: 5px;

    z-index: 20;

    pointer-events: none;
}

.killfeed-item {
    padding: 5px 15px;

    background: rgba(30, 30, 30, .8);

    border: 1px solid #444;
    border-radius: 4px;

    font-size: 13px;

    display: flex;

    align-items: center;

    gap: 10px;

    animation: fadeOut 4s forwards;
}

.kf-killer {
    color: #fff;
    font-weight: bold;
}

.kf-weapon {
    color: #888;
    font-size: 11px;
}

.kf-victim {
    color: #ff4d4d;
    font-weight: bold;
}

@keyframes fadeOut {

    0% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   АДАПТАЦИЯ ДЛЯ МАЛЕНЬКИХ ЭКРАНОВ
   ========================================================= */

@media (max-width: 600px) {

    #minimap {
        width: 105px;
        height: 105px;

        top: 15px;
        right: 15px;
    }

    #btn-profile {
        top: 15px;
        left: 15px;

        width: 46px;
        height: 46px;
    }

    #team-score {
        top: 14px;

        min-width: 100px;

        font-size: 15px;
    }

    #joystick-zone {
        left: 20px;
        bottom: 20px;

        width: 110px;
        height: 110px;
    }

    #btn-fire {
        right: 20px;
        bottom: 85px;
    }

    #btn-reload {
        right: 120px;
        bottom: 95px;
    }

    #btn-jump {
        right: 110px;
        bottom: 18px;
    }

    #btn-crouch {
        right: 185px;
        bottom: 12px;
    }

    #hud-hp {
        left: 15px;
        bottom: 15px;
    }

    #hud-armor {
        left: 112px;
        bottom: 15px;
    }
}

/* =========================================================
   RESPAWN
   ========================================================= */

#respawn-screen {
    display: none;

    background: rgba(20, 20, 20, .82);
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

</head>

<body>

<div id="canvas-container"></div>

<!-- Зона обзора камеры -->
<div id="camera-look-zone"></div>

<!-- =========================================================
     АВТОРИЗАЦИЯ
     ========================================================= -->

<div id="auth-screen" class="overlay">

    <div class="auth-container">

        <h1>ARENA LOG IN</h1>

        <input
            type="email"
            id="input-email"
            class="auth-input"
            placeholder="E-mail адрес"
        >

        <input
            type="password"
            id="input-pass"
            class="auth-input"
            placeholder="Пароль"
        >

        <input
            type="text"
            id="input-server"
            class="auth-input"
            placeholder="URL Сервера (оставь пустым для авто)"
        >

        <input
            type="text"
            id="input-lobby"
            class="auth-input"
            placeholder="ID Лобби (необязательно)"
        >

        <button
            id="btn-auth"
            class="btn-main"
        >
            ВОЙТИ В ИГРУ
        </button>

        <p
            id="auth-status"
            style="margin-top:15px;color:#888;font-size:13px;"
        >
            Укажите почту для сохранения профиля
        </p>

    </div>

</div>

<!-- =========================================================
     RESPAWN
     ========================================================= -->

<div id="respawn-screen" class="overlay">

    <h2 style="color:#fff;margin-bottom:20px;">
        ВЫ УБИТЫ
    </h2>

    <button
        id="btn-respawn"
        class="btn-main"
        style="max-width:250px;"
    >
        ВОЗРОДИТЬСЯ
    </button>

</div>

<!-- =========================================================
     HUD
     ========================================================= -->

<div id="hud-scalable-wrapper">

    <!-- Профиль -->

    <div
        id="btn-profile"
        class="hud-element"
    >

        <img
            src="https://via.placeholder.com/50/3a3a3a/ffffff?text=U"
            alt="Avatar"
            id="user-avatar"
        >

    </div>


    <!-- Счёт -->

    <div
        id="team-score"
        class="hud-element"
    >

        <span
            id="team-score-left"
            class="team-score-value"
        >
            0
        </span>

        <span class="team-score-divider">
            :
        </span>

        <span
            id="team-score-right"
            class="team-score-value"
        >
            0
        </span>

    </div>


    <!-- Миникарта -->

    <div
        id="minimap"
        class="hud-element"
    >

        <div id="minimap-inner">

            <div id="minimap-player"></div>

        </div>

    </div>


    <!-- Killfeed -->

    <div
        id="killfeed-container"
        class="hud-element"
    ></div>


    <!-- HP -->

    <div
        id="hud-hp"
        class="hud-element hud-stat-box"
    >

        <span>
            Здоровье
        </span>

        <span id="val-hp">
            100
        </span>

    </div>


    <!-- Armor -->

    <div
        id="hud-armor"
        class="hud-element hud-stat-box"
    >

        <span>
            Броня
        </span>

        <span id="val-armor">
            100
        </span>

    </div>


    <!-- Джойстик -->

    <div
        id="joystick-zone"
        class="hud-element"
    >

        <div id="joystick-stick"></div>

    </div>


    <!-- =====================================================
         SVG-КНОПКИ
         ===================================================== -->

    <div
        id="btn-fire"
        class="hud-element btn-game"
        aria-label="Основное действие"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <circle
                cx="12"
                cy="12"
                r="8"
            />

            <circle
                cx="12"
                cy="12"
                r="2"
            />
        </svg>

    </div>


    <div
        id="btn-reload"
        class="hud-element btn-game"
        aria-label="Обновить"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M20 11a8 8 0 0 0-14.8-4"
            />

            <polyline
                points="3 4 5 7 8 5"
            />

            <path
                d="M4 13a8 8 0 0 0 14.8 4"
            />

            <polyline
                points="21 20 19 17 16 19"
            />

        </svg>

    </div>


    <div
        id="btn-jump"
        class="hud-element btn-game"
        aria-label="Прыжок"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path d="M12 19V5" />

            <polyline
                points="6 11 12 5 18 11"
            />

        </svg>

    </div>


    <div
        id="btn-crouch"
        class="hud-element btn-game"
        aria-label="Присесть"
    >

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path d="M12 5v14" />

            <polyline
                points="6 13 12 19 18 13"
            />

        </svg>

    </div>

</div>

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="js/settings.js"></script>

<script src="js/state.js"></script>

<script src="js/engine.js"></script>

<script src="js/network.js"></script>

<script src="js/weapons.js"></script>

<script src="js/controls.js"></script>

<script src="js/camera.js"></script>

<script src="js/ui.js"></script>

<script src="js/main.js"></script>

</body>

</html>
