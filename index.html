<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D PvP Cyber Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="player.js" onerror="console.warn('player.js не найден, включена автозамена')"></script>
    <script src="item.js" onerror="console.warn('item.js не найден, включена автозамена')"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0f1d; font-family: 'Arial', sans-serif; touch-action: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        
        #hud { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .hud-bar { background: rgba(10, 16, 30, 0.85); padding: 8px 15px; border-radius: 5px; border-left: 5px solid #333; font-weight: bold; font-size: 14px; color: #fff; box-shadow: 0 2px 10px rgba(0,255,255,0.2); border-top: 1px solid rgba(255,255,255,0.1); }
        #hud-hp { border-left-color: #ff3333; }
        #hud-armor { border-left-color: #00aaff; }
        #hud-ammo { position: absolute; bottom: 25px; left: 25px; border-left-color: #ffaa00; z-index: 10; font-size: 18px; pointer-events: none; background: rgba(10, 16, 30, 0.85); color: #fff; }
        
        #top-right-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 40; }
        #kills-counter { background: rgba(10, 16, 30, 0.85); border: 2px solid #ff0055; color: #fff; font-weight: bold; padding: 8px 15px; border-radius: 5px; font-size: 14px; }
        #btn-fullscreen { background: #ff0055; color: #fff; border: none; font-weight: bold; padding: 8px 15px; border-radius: 5px; font-size: 12px; cursor: pointer; }

        #leaderboard-screen, #voting-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,15,30,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; display: none; }
        .vote-btn { background: #1a233d; border: 2px solid #00aaff; color: #fff; padding: 12px 30px; margin: 10px; font-size: 18px; border-radius: 8px; pointer-events: auto; font-weight: bold; }
        .vote-btn:active { background: #ff0055; border-color: #fff; }

        #reticle { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #reticle::before, #reticle::after { content: ''; position: absolute; background: #00ffff; box-shadow: 0 0 5px #00ffff; }
        #reticle::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #reticle::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #death-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 55, 0.75); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; color: white; display: none; }
        #respawn-btn { background: #fff; color: #ff0055; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; pointer-events: auto; }

        .touch-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 20px; pointer-events: none; z-index: 20; }
        .zone { width: 38%; height: 85%; background: rgba(255,255,255,0.01); border: 1px dashed rgba(255,255,255,0.05); border-radius: 20px; pointer-events: auto; position: relative; }
        
        .action-container { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; z-index: 30; }
        .circle-btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00aaff; color: #fff; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; background: rgba(10,20,40,0.8); box-shadow: 0 0 10px rgba(0,170,255,0.3); }
        #btn-shoot { width: 85px; height: 85px; background: linear-gradient(135deg, #ff0055, #cc0044); color: white; border-color: white; font-size: 16px; box-shadow: 0 0 15px #ff0055; }
        
        .label { position: absolute; top: 10px; left: 10px; color: rgba(255, 255, 255, 0.2); font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="auth-screen" style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,15,30,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: white;">
            <h2 style="margin-bottom: 20px; color: #00aaff; text-shadow: 0 0 10px #00aaff;">ВХОД В КИБЕР-АРЕНУ</h2>
            <input type="text" id="auth-nick" placeholder="Ваш Никнейм" style="padding: 10px; margin: 10px; width: 250px; border-radius: 5px; border: 1px solid #00aaff; background: #1a233d; color: white; text-align: center;">
            <input type="password" id="auth-pass" placeholder="Пароль" style="padding: 10px; margin: 10px; width: 250px; border-radius: 5px; border: 1px solid #00aaff; background: #1a233d; color: white; text-align: center;">
            <button id="btn-auth-submit" style="background: #ff0055; color: white; border: none; padding: 12px 40px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; box-shadow: 0 0 15px #ff0055;">ВОЙТИ / СОЗДАТЬ</button>
            <p id="auth-error" style="color: #ff3333; margin-top: 15px; font-size: 14px;"></p>
        </div>

        <div id="reticle"></div>
        
        <div id="hud">
            <div class="hud-bar" id="hud-hp">❤️ HP: 100</div>
            <div class="hud-bar" id="hud-armor">🛡️ ARM: 100</div>
        </div>
        <div class="hud-bar" id="hud-ammo">🔫 Ammo: 30 / 90</div>

        <div id="top-right-controls">
            <div id="kills-counter">💀 Убийства: 0 / 15</div>
            <button id="btn-fullscreen">📺 ЭКРАН</button>
        </div>

        <div class="touch-container">
            <div class="zone" id="move-pad"><span class="label">Ходьба</span></div>
            <div class="zone" id="look-pad"><span class="label">Обзор</span></div>
        </div>

        <div class="action-container">
            <div class="circle-btn" id="btn-shoot">ОГОНЬ</div>
            <div class="circle-btn" id="btn-reload">🔄 ПЕРЕЗР.</div>
            <div class="circle-btn" id="btn-jump">🚀 ПРЫЖОК</div>
        </div>

        <div id="death-screen">
            <h1 style="font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 10px #000;">ВЫ ПОГИБЛИ</h1>
            <button id="respawn-btn">РЕСПАВН</button>
        </div>

        <div id="leaderboard-screen">
            <h1 style="color: #ff0055; margin-bottom: 15px; text-shadow: 0 0 10px #ff0055;">МАТЧ ОКОНЧЕН</h1>
            <div id="leaderboard-list" style="font-size: 20px; line-height: 2; margin-bottom: 30px;"></div>
        </div>

        <div id="voting-screen">
            <h2>ВЫБЕРИТЕ СЛЕДУЮЩУЮ КАРТУ</h2>
            <button class="vote-btn" onclick="voteForMap('arena')">[ АРЕНА ] (<span id="v-arena">0</span>)</button>
            <button class="vote-btn" onclick="voteForMap('factory')">[ ЗАВОД ] (<span id="v-factory">0</span>)</button>
            <button class="vote-btn" onclick="voteForMap('city')">[ ГОРОД ] (<span id="v-city">0</span>)</button>
        </div>
    </div>

    <script>
        // --- РЕЗЕРВНЫЕ ФУНКЦИИ ЗАЩИТЫ МОДЕЛЕЙ ---
        if (typeof createCharacterModel !== 'function') {
            window.createCharacterModel = function() {
                const g = new THREE.Group();
                const m = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0xff0033}));
                m.position.y = 1; g.add(m); 
                const h = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({color: 0xffaa00}));
                h.name = "head"; h.position.y = 2.2; g.add(h);
                g.userData = { legL: new THREE.Group(), legR: new THREE.Group() };
                return g;
            };
        }
        if (typeof createSupplyBoxModel !== 'function') {
            window.createSupplyBoxModel = function() {
                const g = new THREE.Group();
                const m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0x00ffaa}));
                g.add(m); return g;
            };
        }

        // Подключение к твоему серверу на Render
        const socket = io('https://pvp-arena-online.onrender.com'); 

        // --- СИСТЕМА АВТО-АВТОРИЗАЦИИ (LOCALSTORAGE) ---
        const authScreen = document.getElementById('auth-screen');
        const authError = document.getElementById('auth-error');

        const savedNick = localStorage.getItem('game_nick');
        const savedPass = localStorage.getItem('game_pass');

        // Если в памяти есть данные, сразу пробуем войти скрытно
        if (savedNick && savedPass) {
            socket.emit('playerAuth', { nick: savedNick, pass: savedPass });
        } else {
            authScreen.style.display = 'flex';
        }

        // Кнопка ручной отправки
        document.getElementById('btn-auth-submit').addEventListener('click', () => {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();

            if (nick.length < 3 || pass.length < 4) {
                authError.innerText = "Ник от 3 символов, пароль от 4!";
                return;
            }

            if (!socket.connected) {
                authError.innerText = "Нет связи с сервером. Подожди немного (Render просыпается)...";
                return;
            }

            authError.innerText = "Отправка данных...";
            socket.emit('playerAuth', { nick, pass });
        });

        socket.on('authSuccess', (data) => {
            localStorage.setItem('game_nick', data.nick);
            localStorage.setItem('game_pass', data.pass);
            authScreen.style.display = 'none';
            authError.innerText = "";
        });

        socket.on('authFailed', (message) => {
            authScreen.style.display = 'flex';
            authError.innerText = message;
            localStorage.removeItem('game_nick');
            localStorage.removeItem('game_pass');
        });

        // --- ИНИЦИАЛИЗАЦИЯ THREE.JS СЦЕНЫ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d); 
        scene.fog = new THREE.FogExp2(0x0a0f1d, 0.02); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        document.getElementById('game-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3); 
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0x88ccff, 0.9);
        sunLight.position.set(20, 60, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let hp = 100, armor = 100, ammo = 30, reserveAmmo = 90, kills = 0;
        const MAX_RESERVE_AMMO = 120; 

        let isDead = false, isReloading = false, currentMap = 'arena';
        let moveInput = { x: 0, y: 0 }, rotY = 0, rotX = 0, verticalVelocity = 0, isGrounded = true;
        const opponents = {};
        
        let shootInterval = null;
        let isShootingPressed = false;
        let supplyCrates = [];
        let wallMeshes = [];

        let lastNetUpdate = 0;
        const netTickRate = 1000 / 30; 

        // --- ОРУЖИЕ В РУКАХ (HUD) ---
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);
        scene.add(camera);

        function buildWeapon() {
            while(weaponGroup.children.length > 0) weaponGroup.remove(weaponGroup.children[0]);
            const ironMat = new THREE.MeshStandardMaterial({ color: 0x22252c, roughness: 0.4, metalness: 0.8 });
            const neonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.4), ironMat);
            mainBody.position.set(0.25, -0.25, -0.45);
            weaponGroup.add(mainBody);

            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.06), ironMat);
            grip.position.set(0.25, -0.34, -0.35);
            grip.rotation.x = -0.3;
            weaponGroup.add(grip);

            const laserLine = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.01, 0.38), neonMat);
            laserLine.position.set(0.25, -0.21, -0.45);
            weaponGroup.add(laserLine);
        }
        buildWeapon();

        // --- СТРОИТЕЛЬСТВО КИБЕР-КАРТЫ ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x121622, roughness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI/2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        const grid = new THREE.GridHelper(100, 50, 0x00aaff, 0x1f293d); 
        grid.position.y = 0.01;
        scene.add(grid);

        function buildMap(mapName) {
            wallMeshes.forEach(w => scene.remove(w));
            wallMeshes = [];
            
            let themeColor = 0x00aaff; 
            if(mapName === 'factory') themeColor = 0xffaa00; 
            if(mapName === 'city') themeColor = 0xff0055; 

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1b2234, roughness: 0.3 });
            const glowMat = new THREE.MeshBasicMaterial({ color: themeColor });

            function createStructure(w, h, d, x, z) {
                const group = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                base.castShadow = true; base.receiveShadow = true;
                group.add(base);

                const neon = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.1, d + 0.04), glowMat);
                neon.position.y = h / 2 - 0.2;
                group.add(neon);

                group.position.set(x, h/2, z);
                scene.add(group);

                const collisionMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                collisionMesh.position.set(x, h/2, z);
                wallMeshes.push(collisionMesh);
            }

            createStructure(6, 0.5, 6, 0, 0); 
            createStructure(3, 7, 3, -15, -15); 
            createStructure(3, 7, 3, 15, -15);
            createStructure(3, 7, 3, -15, 15);
            createStructure(3, 7, 3, 15, 15);
            createStructure(8, 3, 1.5, 0, -12); 
            createStructure(8, 3, 1.5, 0, 12);
            createStructure(1.5, 3, 8, -12, 0);
            createStructure(1.5, 3, 8, 12, 0);
            createStructure(100, 5, 2, 0, -49); 
            createStructure(100, 5, 2, 0, 49);
            createStructure(2, 5, 100, -49, 0);
            createStructure(2, 5, 100, 49, 0);

            respawnSupplyCrates();
        }

        function respawnSupplyCrates() {
            supplyCrates.forEach(crate => scene.remove(crate));
            supplyCrates = [];
            const cratePositions = [{x: -15, z: -12}, {x: 15, z: 12}, {x: 0, z: 0}];
            cratePositions.forEach(pos => {
                const container = new THREE.Group();
                container.position.set(pos.x, 0.5, pos.z);
                container.add(createSupplyBoxModel());
                scene.add(container);
                supplyCrates.push(container);
            });
        }

        buildMap('arena');
        setInterval(() => { respawnSupplyCrates(); }, 60000);

        function createHealthBar() {
            const barGroup = new THREE.Group();
            const bg = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide }));
            barGroup.add(bg);

            const hpMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.16, 0.11), new THREE.MeshBasicMaterial({ color: 0x00ffaa, side: THREE.DoubleSide }));
            hpMesh.position.z = 0.01;
            barGroup.add(hpMesh);

            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.25), new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide }));
            textMesh.position.set(0, 0.25, 0.02);
            barGroup.add(textMesh);
            barGroup.position.y = 2.6;
            return { group: barGroup, hpMesh: hpMesh, canvas: canvas, texture: texture, ctx: ctx };
        }

        // --- МОБИЛЬНОЕ УПРАВЛЕНИЕ ---
        setupJoystick('move-pad', (dx, dy) => { moveInput.x = dx; moveInput.y = dy; });
        setupLookPad('look-pad');

        function setupJoystick(id, callback) {
            const el = document.getElementById(id);
            let tid = null, sx = 0, sy = 0;
            el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tid = t.identifier; sx = t.clientX; sy = t.clientY; });
            el.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === tid) {
                        let dx = (t.clientX - sx)/50; let dy = (t.clientY - sy)/50;
                        let d = Math.sqrt(dx*dx+dy*dy); if(d>1){dx/=d; dy/=d;}
                        callback(dx, -dy);
                    }
                }
            });
            el.addEventListener('touchend', e => { for(let t of e.changedTouches) { if(t.identifier === tid){ tid=null; callback(0,0); } } });
        }

        function setupLookPad(id) {
            const el = document.getElementById(id);
            let tid = null, lx = 0, ly = 0;
            el.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tid = t.identifier; lx = t.clientX; ly = t.clientY; });
            el.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === tid) {
                        rotY -= (t.clientX - lx) * 0.005;
                        rotX -= (t.clientY - ly) * 0.005;
                        rotX = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, rotX));
                        lx = t.clientX; ly = t.clientY;
                    }
                }
            });
            el.addEventListener('touchend', e => { for(let t of e.changedTouches) { if(t.identifier === tid) tid=null; } });
        }

        const shootBtn = document.getElementById('btn-shoot');
        shootBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(isDead || isReloading || authScreen.style.display !== 'none') return;
            isShootingPressed = true;
            fireBullet();
            shootInterval = setInterval(() => { if(isShootingPressed) fireBullet(); }, 150);
        });
        window.addEventListener('touchend', () => { isShootingPressed = false; clearInterval(shootInterval); });

        document.getElementById('btn-reload').addEventListener('touchstart', startManualReload);
        document.getElementById('btn-jump').addEventListener('touchstart', () => { if(isGrounded && !isDead) { verticalVelocity = 0.15; isGrounded = false; } });
        document.getElementById('respawn-btn').addEventListener('click', () => { socket.emit('requestRespawn'); document.getElementById('death-screen').style.display = 'none'; isDead = false; });
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        function updateHUD() {
            document.getElementById('hud-hp').innerText = `❤️ HP: ${hp}`;
            document.getElementById('hud-armor').innerText = `🛡️ ARM: ${armor}`;
            document.getElementById('hud-ammo').innerText = isReloading ? `🔄 REPLAYING...` : `🔫 Ammo: ${ammo} / ${reserveAmmo}`;
            document.getElementById('kills-counter').innerText = `💀 Убийства: ${kills} / 15`;
        }

        // --- ЛОГИКА СТРЕЛЬБЫ И ХЕДШОТОВ ---
        function fireBullet() {
            if(ammo <= 0 || isDead || isReloading) { isShootingPressed = false; clearInterval(shootInterval); return; }
            ammo--;
            updateHUD();

            weaponGroup.position.z = 0.08; 

            if (ammo === 0) { isShootingPressed = false; clearInterval(shootInterval); startAutoReload(); }

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const targetMeshes = [];
            Object.values(opponents).forEach(op => {
                op.mesh.traverse(child => {
                    if (child.isMesh) {
                        child.userData.enemyId = op.mesh.name; 
                        targetMeshes.push(child);
                    }
                });
            });

            const intersects = raycaster.intersectObjects(targetMeshes);
            if(intersects.length > 0) {
                const hitPart = intersects[0].object;
                const enemyId = hitPart.userData.enemyId;
                
                let hitZone = 'body';
                if (hitPart.name && hitPart.name.toLowerCase().includes('head')) {
                    hitZone = 'head';
                } else if (hitPart.geometry && hitPart.geometry.type === 'SphereGeometry') {
                    hitZone = 'head';
                }

                socket.emit('playerHit', { targetId: enemyId, zone: hitZone });
            }
        }

        function startManualReload() { if (reserveAmmo <= 0 || ammo === 30 || isDead || isReloading) return; triggerReloadProcess(); }
        function startAutoReload() { if (reserveAmmo <= 0) return; triggerReloadProcess(); }

        function triggerReloadProcess() {
            isReloading = true; updateHUD();
            setTimeout(() => {
                let needed = 30 - ammo;
                if(reserveAmmo >= needed) { ammo += needed; reserveAmmo -= needed; } 
                else { ammo += reserveAmmo; reserveAmmo = 0; }
                isReloading = false; updateHUD();
            }, 3000);
        }

        function voteForMap(mapName) { socket.emit('voteMap', mapName); }

        socket.on('init', (data) => { camera.position.set(data.x, 2, data.z); });

        socket.on('updatePlayers', (serverPlayers) => {
            Object.keys(serverPlayers).forEach(id => {
                if(id === socket.id) {
                    hp = serverPlayers[id].hp; armor = serverPlayers[id].armor; kills = serverPlayers[id].kills;
                    updateHUD();
                    if(hp <= 0 && !isDead) {
                        isDead = true; isShootingPressed = false; clearInterval(shootInterval);
                        document.getElementById('death-screen').style.display = 'flex';
                    }
                    return;
                }

                if(!opponents[id]) {
                    const charModel = createCharacterModel(false);
                    charModel.name = id;
                    const hb = createHealthBar();
                    charModel.add(hb.group);
                    scene.add(charModel);
                    
                    opponents[id] = { 
                        mesh: charModel, hpMesh: hb.hpMesh, hbGroup: hb.group, ctx: hb.ctx, texture: hb.texture,
                        lastX: serverPlayers[id].x, lastZ: serverPlayers[id].z, isMoving: false
                    };
                }

                let dx = serverPlayers[id].x - opponents[id].lastX;
                let dz = serverPlayers[id].z - opponents[id].lastZ;
                opponents[id].isMoving = (Math.abs(dx) > 0.01 || Math.abs(dz) > 0.01);
                
                opponents[id].lastX = serverPlayers[id].x;
                opponents[id].lastZ = serverPlayers[id].z;

                opponents[id].mesh.position.set(serverPlayers[id].x, 0, serverPlayers[id].z);
                if(serverPlayers[id].rotY) opponents[id].mesh.rotation.y = serverPlayers[id].rotY;

                let currentHp = serverPlayers[id].hp;
                let healthPercent = currentHp / 100;
                opponents[id].hpMesh.scale.x = Math.max(0, healthPercent);
                opponents[id].hpMesh.position.x = (1 - healthPercent) * -0.58; 

                opponents[id].ctx.clearRect(0, 0, 128, 32);
                opponents[id].ctx.fillStyle = '#ffffff';
                opponents[id].ctx.font = 'Bold 16px Arial';
                opponents[id].ctx.fillText(`${serverPlayers[id].nick || 'Игрок'}: ${currentHp}`, 64, 22);
                opponents[id].texture.needsUpdate = true;
            });

            Object.keys(opponents).forEach(id => { if(!serverPlayers[id]) { scene.remove(opponents[id].mesh); delete opponents[id]; } });
        });

        socket.on('mapChange', (mapName) => {
            currentMap = mapName; buildMap(mapName);
            document.getElementById('voting-screen').style.display = 'none';
            document.getElementById('leaderboard-screen').style.display = 'none';
        });

        socket.on('matchEnd', (data) => {
            document.getElementById('leaderboard-screen').style.display = 'flex';
            let list = document.getElementById('leaderboard-list');
            list.innerHTML = data.leaderboard.map((p, i) => `${i+1}. ${p.nick || 'Игрок'} — ${p.kills} фрагов`).join('<br>');
            setTimeout(() => { document.getElementById('voting-screen').style.display = 'flex'; }, 4000);
        });

        socket.on('updateVotes', (votes) => {
            document.getElementById('v-arena').innerText = votes.arena || 0;
            document.getElementById('v-factory').innerText = votes.factory || 0;
            document.getElementById('v-city').innerText = votes.city || 0;
        });

        // --- ИГРОВОЙ ЦИКЛ (ANIMATE) ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.002;
            
            supplyCrates.forEach(crate => { crate.rotation.y += 0.015; crate.position.y = 0.5 + Math.sin(time) * 0.08; });

            weaponGroup.position.z += (0 - weaponGroup.position.z) * 0.2; 

            if (!isDead && (Math.abs(moveInput.x) > 0.1 || Math.abs(moveInput.y) > 0.1)) {
                weaponGroup.position.y = Math.sin(performance.now() * 0.01) * 0.015;
                weaponGroup.position.x = Math.cos(performance.now() * 0.005) * 0.01;
            } else {
                weaponGroup.position.y += (0 - weaponGroup.position.y) * 0.1;
                weaponGroup.position.x += (0 - weaponGroup.position.x) * 0.1;
            }

            const legWave = Math.sin(performance.now() * 0.012);
            Object.values(opponents).forEach(op => {
                if(op.hbGroup) op.hbGroup.quaternion.copy(camera.quaternion);

                if (op.mesh.userData && op.mesh.userData.legL && op.mesh.userData.legR) {
                    if (op.isMoving) {
                        op.mesh.userData.legL.rotation.x = legWave * 0.6;
                        op.mesh.userData.legR.rotation.x = -legWave * 0.6;
                    } else {
                        op.mesh.userData.legL.rotation.x += (0 - op.mesh.userData.legL.rotation.x) * 0.2;
                        op.mesh.userData.legR.rotation.x += (0 - op.mesh.userData.legR.rotation.x) * 0.2;
                    }
                }
            });

            if(!isDead && authScreen.style.display === 'none') {
                camera.rotation.order = "YXZ";
                camera.rotation.y = rotY; camera.rotation.x = rotX;

                const speed = 0.08;
                let forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                let side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize(); side.y = 0; side.normalize();

                let nextX = camera.position.x + (forward.x * moveInput.y + side.x * moveInput.x) * speed;
                let nextZ = camera.position.z + (forward.z * moveInput.y + side.z * moveInput.x) * speed;

                let playerSize = 0.6; 
                let allowMoveX = true; let allowMoveZ = true;

                for (let wall of wallMeshes) {
                    let wX = wall.position.x; let wZ = wall.position.z;
                    let halfW = wall.geometry.parameters.width / 2;
                    let halfD = wall.geometry.parameters.depth / 2;

                    if (nextX + playerSize > wX - halfW && nextX - playerSize < wX + halfW &&
                        camera.position.z + playerSize > wZ - halfD && camera.position.z - playerSize < wZ + halfD) {
                        allowMoveX = false;
                    }
                    if (camera.position.x + playerSize > wX - halfW && camera.position.x - playerSize < wX + halfW &&
                        nextZ + playerSize > wZ - halfD && nextZ - playerSize < wZ + halfD) {
                        allowMoveZ = false;
                    }
                }

                if (allowMoveX) camera.position.x = nextX;
                if (allowMoveZ) camera.position.z = nextZ;

                camera.position.y += verticalVelocity;
                if(camera.position.y > 2) { verticalVelocity -= 0.009; } 
                else { camera.position.y = 2; verticalVelocity = 0; isGrounded = true; }

                camera.position.x = Math.max(-48, Math.min(48, camera.position.x));
                camera.position.z = Math.max(-48, Math.min(48, camera.position.z));

                // Сбор ящиков снабжения (+30 HP, +20 Броня, макс 120 патронов)
                for (let i = supplyCrates.length - 1; i >= 0; i--) {
                    let crate = supplyCrates[i];
                    let dist = Math.sqrt(Math.pow(camera.position.x - crate.position.x, 2) + Math.pow(camera.position.z - crate.position.z, 2));
                    if (dist < 1.6) {
                        hp = Math.min(100, hp + 30);
                        armor = Math.min(100, armor + 20); 
                        reserveAmmo = Math.min(MAX_RESERVE_AMMO, reserveAmmo + 60); 
                        updateHUD();
                        scene.remove(crate);
                        supplyCrates.splice(i, 1);
                    }
                }

                const now = performance.now();
                if (now - lastNetUpdate > netTickRate) {
                    socket.emit('playerMove', { x: camera.position.x, z: camera.position.z, rotY: rotY });
                    lastNetUpdate = now;
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
