<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D PvP Cyber Arena Online</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #050811;
            font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; left: 0; top: 0; z-index: 1; }

        /* ОКНО ВХОДА */
        #auth-screen {
            position: absolute; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .auth-container {
            background: rgba(30, 41, 59, 0.7); padding: 30px; border-radius: 15px; border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); text-align: center; width: 85%; max-width: 320px; backdrop-filter: blur(10px);
        }
        .auth-container h2 { margin-top: 0; margin-bottom: 25px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-size: 22px; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; text-align: center; }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #ff0055, #ff00aa); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); }
        #auth-status { color: #38bdf8; margin-top: 15px; font-size: 14px; font-weight: 500; }

        /* ИГРОВОЙ ИНТЕРФЕЙС HUD */
        #hud { position: absolute; top: 12px; left: 12px; z-index: 10; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
        .hud-bar { background: rgba(15, 23, 42, 0.75); color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 15px; border-left: 4px solid #fff; backdrop-filter: blur(4px); min-width: 110px; }
        #hud-hp { border-left-color: #ef4444; color: #fca5a5; }
        #hud-armor { border-left-color: #3b82f6; color: #93c5fd; }
        #hud-ammo { border-left-color: #eab308; color: #fef08a; }

        #game-timer { 
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(10, 16, 30, 0.85); border: 2px solid #00ffff; color: #00ffff; 
            font-weight: bold; padding: 6px 20px; border-radius: 5px; font-size: 16px; 
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); font-variant-numeric: tabular-nums;
        }

        #top-right-controls { position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        #kills-counter { background: rgba(15, 23, 42, 0.75); color: #38bdf8; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; border: 1px solid #38bdf8; }
        
        .control-row { display: flex; gap: 6px; }
        .small-btn { background: rgba(30, 41, 59, 0.8); color: #94a3b8; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; pointer-events: auto; }
        #btn-settings { border-color: #eab308; color: #fef08a; }

        /* НОВЫЙ ДИНАМИЧЕСКИЙ ПРИЦЕЛ С ПОДДЕРЖКОЙ НАСТРОЕК */
        #crosshair { 
            --crosshair-color: #00ffcc;
            --crosshair-size: 10px;
            position: absolute; top: 50%; left: 50%; 
            width: var(--crosshair-size); height: var(--crosshair-size); 
            transform: translate(-50%, -50%); z-index: 5; pointer-events: none; 
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: var(--crosshair-color); }
        #crosshair::before { top: calc(50% - 1px); left: -5px; width: calc(var(--crosshair-size) + 10px); height: 2px; }
        #crosshair::after { top: -5px; left: calc(50% - 1px); width: 2px; height: calc(var(--crosshair-size) + 10px); }

        /* ЭЛЕМЕНТЫ УПРАВЛЕНИЯ */
        .draggable { position: absolute; z-index: 25; touch-action: none; user-select: none; }
        
        #joystick-zone { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; left: 40px; bottom: 40px; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%); border-radius: 50%; pointer-events: none; }
        
        .btn-action { border: none; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; border-radius: 50%; pointer-events: auto; }
        
        #btn-fire { width: 95px; height: 95px; background: radial-gradient(circle, #ef4444 0%, #991b1b 100%); border: 3px solid #f87171; font-size: 16px; letter-spacing: 1px; right: 120px; bottom: 90px; }
        #btn-jump { width: 65px; height: 65px; background: #065f46; border: 1px solid #059669; font-size: 10px; right: 35px; bottom: 150px; }
        #btn-crouch { width: 65px; height: 65px; background: #1e3a8a; border: 1px solid #3b82f6; font-size: 10px; right: 35px; bottom: 35px; }
        #btn-reload { width: 65px; height: 65px; background: #475569; border: 1px solid #64748b; font-size: 10px; right: 120px; bottom: 35px; }

        /* ПРОДВИНУТОЕ ГЛАВНОЕ МЕНЮ НАСТРОЕК */
        #settings-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(11, 18, 36, 0.96); border: 2px solid #38bdf8; padding: 25px; border-radius: 16px;
            z-index: 110; display: none; width: 85%; max-width: 360px; color: white; backdrop-filter: blur(12px); box-shadow: 0 0 35px rgba(0, 242, 255, 0.25);
        }
        #settings-panel h3 { margin: 0 0 20px 0; text-align: center; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
        .setting-item input[type="range"] { width: 120px; accent-color: #38bdf8; }
        .setting-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #38bdf8; cursor: pointer; }
        .setting-item select { background: #1e293b; color: white; border: 1px solid #475569; padding: 4px 8px; border-radius: 6px; outline: none; }
        
        .panel-grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
        .panel-btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; transition: background 0.2s; }
        
        #btn-custom-layout { grid-column: span 2; background: #eab308; color: #000; }
        #btn-save-settings { background: #10b981; color: white; }
        #btn-close-settings { background: #475569; color: white; }
        #btn-reset-all { grid-column: span 2; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; margin-top: 5px; }

        /* МИНИ-ОКНО СОХРАНЕНИЯ РАСКЛАДКИ */
        #layout-edit-subpanel {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid #eab308; padding: 12px 25px; border-radius: 10px;
            z-index: 120; display: none; text-align: center; color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #respawn-screen { position: absolute; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; backdrop-filter: blur(6px); }
        .edit-mode { outline: 2px dashed #eab308 !important; background: rgba(234, 179, 8, 0.2) !important; border-radius: 50%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="settings.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h2>Вход в кибер-арену</h2>
            <input type="text" id="input-nick" class="auth-input" placeholder="Твой Никнейм" maxlength="12">
            <input type="password" id="input-pass" class="auth-input" placeholder="Пароль" maxlength="16">
            <button id="btn-auth" class="auth-btn">Войти / Создать</button>
            <div id="auth-status">Подключение к серверу...</div>
        </div>
    </div>

    <div id="respawn-screen">
        <h1 style="color: #ef4444;">ТЕБЯ УБИЛИ!</h1>
        <button id="btn-respawn" class="auth-btn" style="width: auto; padding: 15px 40px;">Возродиться</button>
    </div>

    <div id="settings-panel">
        <h3>⚙️ Настройки игры</h3>
        
        <div class="setting-item">
            <span>Чувствительность (<span id="setting-sens-value">5.0</span>)</span>
            <input type="range" id="setting-sens" min="1" max="15" step="0.5" value="5">
        </div>
        
        <div class="setting-item">
            <span>Инверсия мыши (Y)</span>
            <input type="checkbox" id="setting-invert">
        </div>

        <div class="setting-item">
            <span>Цвет прицела</span>
            <select id="setting-color">
                <option value="#00ffcc">Бирюзовый</option>
                <option value="#ef4444">Красный</option>
                <option value="#10b981">Зеленый</option>
                <option value="#eab308">Желтый</option>
                <option value="#ffffff">Белый</option>
            </select>
        </div>

        <div class="setting-item">
            <span>Размер прицела</span>
            <input type="range" id="setting-size" min="6" max="24" step="2" value="10">
        </div>

        <div class="setting-item">
            <span>Атмосферный Туман</span>
            <input type="checkbox" id="setting-fog" checked>
        </div>

        <div class="panel-grid-buttons">
            <button id="btn-custom-layout" class="panel-btn">✏️ Изменить раскладку HUD</button>
            <button id="btn-save-settings" class="panel-btn">Сохранить</button>
            <button id="btn-close-settings" class="panel-btn">Отмена</button>
            <button id="btn-reset-all" class="panel-btn">🚨 Полный сброс данных</button>
        </div>
    </div>

    <div id="layout-edit-subpanel">
        <p style="margin: 0 0 8px 0; font-size: 13px; font-weight: bold; color: #eab308;">🛠️ Режим редактирования кнопок</p>
        <button id="btn-save-layout" class="panel-btn" style="background:#10b981; color:white; padding: 6px 15px;">Готово</button>
    </div>

    <div id="hud">
        <div id="hud-hp" class="hud-bar">❤️ HP: 100</div>
        <div id="hud-armor" class="hud-bar">🛡️ Броня: 0</div>
        <div id="hud-ammo" class="hud-bar">🔫 Патроны: 30 / 120</div>
    </div>

    <div id="game-timer">03:00</div>

    <div id="top-right-controls">
        <div id="kills-counter">💀 Убийства: 0</div>
        <div class="control-row">
            <button id="btn-settings" class="small-btn">⚙️ НАСТРОЙКИ</button>
            <button id="btn-fullscreen" class="small-btn">📺 ЭКРАН</button>
        </div>
    </div>

    <div id="crosshair"></div>
    
    <div id="joystick-zone" class="draggable"><div id="joystick-stick"></div></div>
    <button id="btn-fire" class="btn-action draggable">ОГОНЬ</button>
    <button id="btn-jump" class="btn-action draggable">Прыжок</button>
    <button id="btn-crouch" class="btn-action draggable">Присяд</button>
    <button id="btn-reload" class="btn-action draggable">Перезр.</button>

    <div id="canvas-container"></div>

    <script>
        // НАСТРОЙКА СЕРВЕРА
        const SERVER_URL = "https://pvp-arena-online.onrender.com"; 
        let socket;
        try { socket = io(SERVER_URL); } catch(e) { console.error(e); }

        let myId = null, myNick = "", myPass = "";
        let hp = 100, armor = 0, ammo = 30, reserveAmmo = 120, kills = 0, isReloading = false, isCrouching = false;
        
        let scene, camera, renderer, weaponMesh;
        let yawObject = new THREE.Object3D(), pitchObject = new THREE.Object3D();
        let remotePlayers = {}, mapObjects = [], supplyCrates = [];
        let moveDirection = { forward: 0, right: 0 };
        let playerVelocity = new THREE.Vector3();
        let isGrounded = true;
        
        const GRAVITY = 28; const JUMP_FORCE = 11; let moveSpeed = 14;
        let colliders = [];

        let joystickTouchId = null;
        let lookTouchId = null;
        let lastLookX = 0, lastLookY = 0;
        let fireIntervalId = null;

        if (socket) {
            socket.on('connect', () => { document.getElementById('auth-status').innerText = "Сервер онлайн! Введите данные."; });
            socket.on('connect_error', () => { document.getElementById('auth-status').innerText = "Ошибка подключения к Render..."; });
            socket.on('authSuccess', (data) => { localStorage.setItem('n', data.nick); localStorage.setItem('p', data.pass); document.getElementById('auth-screen').style.display = 'none'; myId = socket.id; });
            socket.on('authFailed', (msg) => { document.getElementById('btn-auth').innerText = "Войти / Создать"; document.getElementById('auth-status').innerText = msg; });
            socket.on('init', (spawnPos) => { yawObject.position.set(spawnPos.x, 1.7, spawnPos.z); hp = 100; armor = 0; ammo = 30; reserveAmmo = 120; updateHUD(); document.getElementById('respawn-screen').style.display = 'none'; });
            socket.on('timerUpdate', (data) => { const m = Math.floor(data.timeLeft / 60); const s = data.timeLeft % 60; document.getElementById('game-timer').innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`; });

            socket.on('updatePlayers', (serverPlayers) => {
                if (myId && serverPlayers[myId]) {
                    kills = serverPlayers[myId].kills;
                    if (serverPlayers[myId].hp <= 0 && hp > 0) { hp = 0; stopAutofire(); updateHUD(); document.getElementById('respawn-screen').style.display = 'flex'; }
                    updateHUD();
                }
                for (let id in serverPlayers) {
                    if (id === socket.id) continue;
                    let pData = serverPlayers[id];
                    if (!remotePlayers[id] && pData.hp > 0) {
                        let group = new THREE.Group();
                        let b = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 12), new THREE.MeshStandardMaterial({ color: 0xff0055 })); b.position.y = 0.7; b.userData = { targetId: id, zone: 'body' }; group.add(b);
                        let h = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff })); h.position.y = 1.6; h.userData = { targetId: id, zone: 'head' }; group.add(h);
                        scene.add(group); remotePlayers[id] = group;
                    }
                    if (remotePlayers[id]) {
                        if (pData.hp <= 0) { scene.remove(remotePlayers[id]); delete remotePlayers[id]; } 
                        else { remotePlayers[id].position.set(pData.x, 0, pData.z); remotePlayers[id].rotation.y = pData.rotY; }
                    }
                }
                for (let id in remotePlayers) { if (!serverPlayers[id]) { scene.remove(remotePlayers[id]); delete remotePlayers[id]; } }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initEngine(); 
            // ЗАПУСКАЕМ ИНИЦИАЛИЗАЦИЮ НАСТРОЕК ИЗ ВНЕШНЕГО ФАЙЛА
            initGameSettings(); 
            setupControls();
            if(localStorage.getItem('n') && localStorage.getItem('p')) {
                document.getElementById('input-nick').value = localStorage.getItem('n'); document.getElementById('input-pass').value = localStorage.getItem('p');
            }
        });

        function initEngine() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0f1d);
            // Делаем сцену глобальной, чтобы settings.js мог управлять туманом напрямую
            window.scene = scene;
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            pitchObject.add(camera); yawObject.add(pitchObject); scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            let dirLight = new THREE.DirectionalLight(0x38bdf8, 0.8); dirLight.position.set(20, 40, 20); scene.add(dirLight);

            buildMap(); createWeapon(); spawnCrates(); animate();
        }

        function createWeapon() {
            let weaponGroup = new THREE.Group();
            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 })); barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, -0.3); weaponGroup.add(barrel);
            let bodyGen = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.45), new THREE.MeshStandardMaterial({ color: 0x1e293b })); bodyGen.position.set(0, -0.02, -0.1); weaponGroup.add(bodyGen);
            let sight = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.02, 0.04), new THREE.MeshBasicMaterial({ color: 0x00ffcc })); sight.position.set(0, 0.035, -0.2); weaponGroup.add(sight);
            weaponGroup.position.set(0.22, -0.2, -0.45); camera.add(weaponGroup); weaponMesh = weaponGroup;
        }

        function buildMap() {
            mapObjects.forEach(obj => scene.remove(obj)); mapObjects = []; colliders = [];
            let floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 })); floor.rotation.x = -Math.PI / 2; scene.add(floor); mapObjects.push(floor);
            let grid = new THREE.GridHelper(100, 50, 0x38bdf8, 0x1f2937); grid.position.y = 0.01; scene.add(grid); mapObjects.push(grid);
            createObstacle(0, 3, 0, 12, 6, 2, 0x334155); createObstacle(-20, 4, 20, 6, 8, 6, 0x0284c7); createObstacle(20, 4, -20, 6, 8, 6, 0x0284c7);
            createObstacle(25, 2, 15, 8, 4, 2, 0x475569); createObstacle(-25, 2, -15, 8, 4, 2, 0x475569);
        }

        function createObstacle(x, y, z, w, h, d, color) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color })); mesh.position.set(x, y, z); scene.add(mesh); mapObjects.push(mesh); colliders.push(new THREE.Box3().setFromObject(mesh));
        }

        function spawnCrates() {
            const cratePoints = [
                new THREE.Vector3(0, 0.5, 12), new THREE.Vector3(-15, 0.5, -12),
                new THREE.Vector3(15, 0.5, -12), new THREE.Vector3(22, 0.5, 22),
                new THREE.Vector3(-22, 0.5, -22)
            ];
            cratePoints.forEach((pos, i) => {
                let mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.7, 0.7, 0.7),
                    new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.5, roughness: 0.2, emissive: 0x451a03 })
                );
                mesh.position.copy(pos); scene.add(mesh);
                supplyCrates.push({ mesh: mesh, baseY: pos.y, active: true, respawnTime: 0 });
            });
        }

        function checkWallCollisions(newPos) {
            let pr = 0.6;
            let playerBox = new THREE.Box3(
                new THREE.Vector3(newPos.x - pr, newPos.y - (isCrouching ? 0.9 : 1.7), newPos.z - pr),
                new THREE.Vector3(newPos.x + pr, newPos.y + 0.3, newPos.z + pr)
            );
            for (let i = 0; i < colliders.length; i++) { if (playerBox.intersectsBox(colliders[i])) return true; }
            return false;
        }

        document.getElementById('btn-auth').addEventListener('click', () => {
            let nickname = document.getElementById('input-nick').value.trim(); let password = document.getElementById('input-pass').value.trim();
            if(nickname.length < 2 || password.length < 3 || !socket) return;
            document.getElementById('btn-auth').innerText = "Вход..."; myNick = nickname; myPass = password;
            socket.emit('playerAuth', { nick: nickname, pass: password });
        });

        function performShot() {
            if (isReloading || hp <= 0 || window.isEditMode) return;
            if (ammo <= 0) { stopAutofire(); startReload(); return; }

            ammo--; updateHUD();
            if(weaponMesh) { weaponMesh.position.z = -0.37; setTimeout(() => weaponMesh.position.z = -0.45, 40); }

            let raycaster = new THREE.Raycaster(); raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            let targets = []; for (let id in remotePlayers) { targets.push(...remotePlayers[id].children); }
            let intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0 && socket) {
                let obj = intersects[0].object.userData; socket.emit('playerHit', { targetId: obj.targetId, zone: obj.zone });
            }
            if (ammo <= 0) { stopAutofire(); startReload(); }
        }

        function startAutofire() { if (fireIntervalId !== null) return; performShot(); fireIntervalId = setInterval(performShot, 75); }
        function stopAutofire() { if (fireIntervalId !== null) { clearInterval(fireIntervalId); fireIntervalId = null; } }

        function startReload() {
            if (isReloading || ammo === 30 || reserveAmmo <= 0 || window.isEditMode) return;
            isReloading = true; updateHUD();
            setTimeout(() => {
                let needed = 30 - ammo; let transfer = Math.min(needed, reserveAmmo);
                ammo += transfer; reserveAmmo -= transfer; isReloading = false; updateHUD();
            }, 1200);
        }

        function updateHUD() {
            document.getElementById('hud-hp').innerText = `❤️ HP: ${hp}`;
            document.getElementById('hud-armor').innerText = `🛡️ Броня: ${armor}`;
            document.getElementById('hud-ammo').innerText = isReloading ? `🔄 ПЕРЕЗАРЯДКА...` : `🔫 Патроны: ${ammo} / ${reserveAmmo}`;
            document.getElementById('kills-counter').innerText = `💀 Убийства: ${kills}`;
        }

        document.getElementById('btn-respawn').addEventListener('click', () => { if(socket) socket.emit('requestRespawn'); });

        function setupControls() {
            const jZone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');

            const fireBtn = document.getElementById('btn-fire');
            fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(!window.isEditMode) startAutofire(); });
            fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopAutofire(); });
            fireBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopAutofire(); });

            document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); startReload(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if(isGrounded && !window.isEditMode) playerVelocity.y = JUMP_FORCE; });
            
            document.getElementById('btn-crouch').addEventListener('touchstart', (e) => { 
                e.preventDefault(); if (window.isEditMode) return;
                isCrouching = !isCrouching;
                if(isCrouching) { moveSpeed = 6; document.getElementById('btn-crouch').style.background = "#3b82f6"; } 
                else { moveSpeed = 14; document.getElementById('btn-crouch').style.background = "#1e3a8a"; }
            });

            document.getElementById('btn-fullscreen').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });

            jZone.addEventListener('touchstart', (e) => {
                if (window.isEditMode) return; e.stopPropagation();
                let t = e.targetTouches[0]; joystickTouchId = t.identifier; updateJoystick(t);
            });
            jZone.addEventListener('touchmove', (e) => {
                if (window.isEditMode) return; e.stopPropagation();
                for(let t of e.touches) { if(t.identifier === joystickTouchId) updateJoystick(t); }
            });
            jZone.addEventListener('touchend', () => { joystickTouchId = null; stick.style.transform = `translate(0px, 0px)`; moveDirection.forward = 0; moveDirection.right = 0; });

            function updateJoystick(touch) {
                let rect = jZone.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2); let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.sqrt(dx*dx + dy*dy); if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`; moveDirection.forward = -(dy / 40); moveDirection.right = (dx / 40);
            }

            // УПРАВЛЕНИЕ КАМЕРОЙ С ИСПОЛЬЗОВАНИЕМ ЛОКАЛЬНЫХ НАСТРОЕК (SENSITIVITY И INVERTY)
            window.addEventListener('touchstart', (e) => {
                if (window.isEditMode) return;
                if (e.target.closest('#joystick-zone') || e.target.closest('#settings-panel') || e.target.closest('#layout-edit-subpanel') || e.target.closest('.small-btn')) return;
                for(let t of e.changedTouches) {
                    if(lookTouchId === null) { lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY; }
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (window.isEditMode) return;
                for(let t of e.changedTouches) {
                    if(t.identifier === lookTouchId) {
                        let dx = t.clientX - lastLookX; let dy = t.clientY - lastLookY;
                        
                        // Используем настройки из сохраненного конфига
                        let currentSens = window.gameSettings.sensitivity;
                        let invertFactor = window.gameSettings.invertY ? -1 : 1;

                        yawObject.rotation.y -= dx * currentSens; 
                        pitchObject.rotation.x -= dy * currentSens * invertFactor;
                        
                        pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x));
                        lastLookX = t.clientX; lastLookY = t.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => { for(let t of e.changedTouches) { if(t.identifier === lookTouchId) lookTouchId = null; } });
            window.addEventListener('touchcancel', (e) => { for(let t of e.changedTouches) { if(t.identifier === lookTouchId) lookTouchId = null; } });
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta(); if (delta > 0.1) delta = 0.1;

            if (myId && hp > 0) {
                playerVelocity.y -= GRAVITY * delta;
                let forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
                let sideVector = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);
                let moveX = (forwardVector.x * moveDirection.forward + sideVector.x * moveDirection.right) * moveSpeed * delta;
                let moveZ = (forwardVector.z * moveDirection.forward + sideVector.z * moveDirection.right) * moveSpeed * delta;

                let targetPos = yawObject.position.clone(); targetPos.x += moveX; if (!checkWallCollisions(targetPos)) yawObject.position.x = targetPos.x;
                targetPos = yawObject.position.clone(); targetPos.z += moveZ; if (!checkWallCollisions(targetPos)) yawObject.position.z = targetPos.z;

                yawObject.position.y += playerVelocity.y * delta;
                let targetHeight = isCrouching ? 0.9 : 1.7;
                if (yawObject.position.y <= targetHeight) { playerVelocity.y = 0; yawObject.position.y = targetHeight; isGrounded = true; } else { isGrounded = false; }

                supplyCrates.forEach(crate => {
                    if (crate.active) {
                        crate.mesh.rotation.y += 1.6 * delta;
                        crate.mesh.position.y = crate.baseY + Math.sin(Date.now() * 0.004) * 0.1;
                        
                        let dist = yawObject.position.distanceTo(crate.mesh.position);
                        if (dist < 1.4) {
                            crate.active = false; crate.mesh.visible = false;
                            crate.respawnTime = Date.now() + 12000;
                            
                            hp = Math.min(100, hp + 30);
                            armor = Math.min(100, armor + 20);
                            reserveAmmo += 60;
                            updateHUD();
                        }
                    } else {
                        if (Date.now() > crate.respawnTime) { crate.active = true; crate.mesh.visible = true; }
                    }
                });

                if(socket) socket.emit('playerMove', { x: yawObject.position.x, z: yawObject.position.z, rotY: yawObject.rotation.y });
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
