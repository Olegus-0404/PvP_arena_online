<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern 3D Mobile Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #050505; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; width: 100vw; height: 100vh; }
        
        /* Экран игры */
        #game-container { width: 100%; height: 100%; position: relative; }
        
        /* Прицел по центру экрана */
        #reticle { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        
        /* Сенсорный интерфейс управления */
        .controls-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 20px; pointer-events: none; z-index: 10; }
        
        /* Зоны тачпада */
        .touch-zone { width: 40%; height: 80%; background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 20px; pointer-events: auto; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Кнопка стрельбы */
        .shoot-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); pointer-events: auto; z-index: 11; }
        .btn-shoot { width: 80px; height: 80px; background: linear-gradient(135deg, #ff0055, #990022); border: 3px solid #fff; border-radius: 50%; color: white; font-weight: bold; font-size: 16px; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
        .btn-shoot:active { background: #ff0055; transform: scale(0.95); }

        .label { position: absolute; top: 10px; color: rgba(255, 255, 255, 0.4); font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="reticle"></div>
        
        <div class="controls-overlay">
            <div class="touch-zone" id="moveZone">
                <span class="label">Ходьба</span>
            </div>
            
            <div class="touch-zone" id="lookZone">
                <span class="label">Обзор</span>
            </div>
        </div>

        <div class="shoot-container">
            <button class="btn-shoot" id="btnShoot">ОГОНЬ</button>
        </div>
    </div>
