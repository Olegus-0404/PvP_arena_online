<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D PvP Cyber Arena Online</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #050811;
            font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; left: 0; top: 0; z-index: 1; }

        /* ОКНО ВХОДА */
        #auth-screen {
            position: absolute; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .auth-container {
            background: rgba(30, 41, 59, 0.7); padding: 30px; border-radius: 15px; border: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); text-align: center; width: 85%; max-width: 320px; backdrop-filter: blur(10px);
        }
        .auth-container h2 { margin-top: 0; margin-bottom: 25px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-size: 22px; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; text-align: center; }
        .auth-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #ff0055, #ff00aa); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); }
        #auth-status { color: #38bdf8; margin-top: 15px; font-size: 14px; font-weight: 500; }

        /* ИГРОВОЙ ИНТЕРФЕЙС HUD */
        #hud { position: absolute; top: 12px; left: 12px; z-index: 10; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
        .hud-bar { background: rgba(15, 23, 42, 0.75); color: white; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 15px; border-left: 4px solid #fff; backdrop-filter: blur(4px); min-width: 110px; }
        #hud-hp { border-left-color: #ef4444; color: #fca5a5; }
        #hud-ammo { border-left-color: #eab308; color: #fef08a; }

        #top-right-controls { position: absolute; top: 12px; right: 12px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        #game-timer { background: rgba(10, 16, 30, 0.85); border: 2px solid #00ffff; color: #00ffff; font-weight: bold; padding: 8px 15px; border-radius: 5px; font-size: 14px; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5); }
        #kills-counter { background: rgba(15, 23, 42, 0.75); color: #38bdf8; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; border: 1px solid #38bdf8; }
        #btn-fullscreen { background: rgba(30, 41, 59, 0.8); color: #94a3b8; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; pointer-events: auto; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); z-index: 5; pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }

        /* ЗОНЫ И НОВАЯ РАСКЛАДКА ИЗ СКИЗУ (1168.jpg) */
        #touch-zone-left { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; z-index: 5; }
        #touch-zone-right { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 5; }

        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; z-index: 10; pointer-events: none; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%); border-radius: 50%; }
        
        /* Кнопки управления справа по твоему рисунку */
        .btn-action { position: absolute; border: none; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; z-index: 20; border-radius: 50%; }
        
        #btn-fire { bottom: 90px; right: 120px; width: 95px; height: 95px; background: radial-gradient(circle, #ef4444 0%, #991b1b 100%); border: 3px solid #f87171; font-size: 16px; letter-spacing: 1px; }
        #btn-jump { bottom: 150px; right: 35px; width: 65px; height: 65px; background: #065f46; border: 1px solid #059669; font-size: 10px; }
        #btn-crouch { bottom: 35px; right: 35px; width: 65px; height: 65px; background: #1e3a8a; border: 1px solid #3b82f6; font-size: 10px; }
        #btn-reload { bottom: 35px; right: 120px; width: 65px; height: 65px; background: #475569; border: 1px solid #64748b; font-size: 10px; }

        #respawn-screen { position: absolute; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; backdrop-filter: blur(6px); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h2>Вход в кибер-арену</h2>
            <input type="text" id="input-nick" class="auth-input" placeholder="Твой Никнейм" maxlength="12">
            <input type="password" id="input-pass" class="auth-input" placeholder="Пароль" maxlength="16">
            <button id="btn-auth" class="auth-btn">Войти / Создать</button>
            <div id="auth-status">Подключение к серверу...</div>
        </div>
    </div>

    <div id="respawn-screen">
        <h1 style="color: #ef4444;">ТЕБЯ УБИЛИ!</h1>
        <button id="btn-respawn" class="auth-btn" style="width: auto; padding: 15px 40px;">Возродиться</button>
    </div>

    <div id="hud">
        <div id="hud-hp" class="hud-bar">❤️ HP: 100</div>
        <div id="hud-ammo" class="hud-bar">🔫 Патроны: 30 / 90</div>
    </div>

    <div id="top-right-controls">
        <div id="game-timer">⏱️ Время: 3:00</div>
        <div id="kills-counter">💀 Убийства: 0</div>
        <button id="btn-fullscreen">📺 ЭКРАН</button>
    </div>

    <div id="crosshair"></div>
    
    <div id="touch-zone-left">
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
    </div>
    <div id="touch-zone-right"></div>
    
    <button id="btn-fire" class="btn-action">ОГОНЬ</button>
    <button id="btn-jump" class="btn-action">Прыжок</button>
    <button id="btn-crouch" class="btn-action">Присяд</button>
    <button id="btn-reload" class="btn-action">Перезр.</button>

    <div id="canvas-container"></div>

    <script>
        const SERVER_URL = "https://pvp-arena-online.onrender.com"; 
        const socket = io(SERVER_URL);

        let myId = null, myNick = "", myPass = "";
        let hp = 100, ammo = 30, reserveAmmo = 90, kills = 0, isReloading = false, isCrouching = false;
        
        let scene, camera, renderer, weaponMesh;
        let yawObject = new THREE.Object3D(), pitchObject = new THREE.Object3D();
        let remotePlayers = {}, mapObjects = [];
        let moveDirection = { forward: 0, right: 0 };
        let playerVelocity = new THREE.Vector3();
        let isGrounded = true;
        
        const GRAVITY = 28; const JUMP_FORCE = 11; let moveSpeed = 14; let lookSpeed = 0.0035;
        let colliders = [];

        // Переменные для отслеживания тачей мультитача
        let joystickTouchId = null;
        let lookTouchId = null;
        let lastLookX = 0, lastLookY = 0;

        socket.on('connect', () => { document.getElementById('auth-status').innerText = "Сервер онлайн! Введите данные."; });
        socket.on('connect_error', () => { document.getElementById('auth-status').innerText = "Ошибка подключения к Render..."; });

        window.addEventListener('DOMContentLoaded', () => {
            initEngine(); setupControls();
            if(localStorage.getItem('n') && localStorage.getItem('p')) {
                document.getElementById('input-nick').value = localStorage.getItem('n');
                document.getElementById('input-pass').value = localStorage.getItem('p');
            }
        });

        function initEngine() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0f1d); scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            pitchObject.add(camera); yawObject.add(pitchObject); scene.add(yawObject);

            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            let dirLight = new THREE.DirectionalLight(0x38bdf8, 0.8); dirLight.position.set(20, 40, 20); scene.add(dirLight);

            buildMap();
            createWeapon(); // Добавление оружия
            animate();
        }

        // СОЗДАНИЕ 3D ПУШКИ В РУКАХ
        function createWeapon() {
            let weaponGroup = new THREE.Group();
            
            // Ствол автомата
            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 }));
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0, -0.3);
            weaponGroup.add(barrel);

            // Корпус оружия
            let bodyGen = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.4), new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.5 }));
            bodyGen.position.set(0, -0.02, -0.1);
            weaponGroup.add(bodyGen);

            // Прицел (светящийся неоновый элемент)
            let sight = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.03, 0.05), new THREE.MeshBasicMaterial({ color: 0x00ffcc }));
            sight.position.set(0, 0.04, -0.2);
            weaponGroup.add(sight);

            // Смещаем и наклоняем пушку в правый нижний угол экрана
            weaponGroup.position.set(0.25, -0.22, -0.45);
            camera.add(weaponGroup);
            weaponMesh = weaponGroup;
        }

        function buildMap() {
            mapObjects.forEach(obj => scene.remove(obj)); mapObjects = []; colliders = [];
            let floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor); mapObjects.push(floor);

            let grid = new THREE.GridHelper(100, 50, 0x38bdf8, 0x1f2937); grid.position.y = 0.01; scene.add(grid); mapObjects.push(grid);

            createObstacle(0, 3, 0, 12, 6, 2, 0x334155);
            createObstacle(-20, 4, 20, 6, 8, 6, 0x0284c7);
            createObstacle(20, 4, -20, 6, 8, 6, 0x0284c7);
            createObstacle(25, 2, 15, 8, 4, 2, 0x475569);
            createObstacle(-25, 2, -15, 8, 4, 2, 0x475569);
        }

        function createObstacle(x, y, z, w, h, d, color) {
            let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color }));
            mesh.position.set(x, y, z); scene.add(mesh); mapObjects.push(mesh);
            colliders.push(new THREE.Box3().setFromObject(mesh));
        }

        function checkWallCollisions(newPos) {
            let pr = 0.6;
            let playerBox = new THREE.Box3(
                new THREE.Vector3(newPos.x - pr, newPos.y - (isCrouching ? 0.9 : 1.7), newPos.z - pr),
                new THREE.Vector3(newPos.x + pr, newPos.y + 0.3, newPos.z + pr)
            );
            for (let i = 0; i < colliders.length; i++) {
                if (playerBox.intersectsBox(colliders[i])) return true;
            }
            return false;
        }

        document.getElementById('btn-auth').addEventListener('click', () => {
            let nickname = document.getElementById('input-nick').value.trim();
            let password = document.getElementById('input-pass').value.trim();
            if(nickname.length < 2 || password.length < 3) return;
            document.getElementById('btn-auth').innerText = "Вход...";
            myNick = nickname; myPass = password;
            socket.emit('playerAuth', { nick: nickname, pass: password });
        });

        socket.on('authSuccess', (data) => {
            localStorage.setItem('n', data.nick); localStorage.setItem('p', data.pass);
            document.getElementById('auth-screen').style.display = 'none'; myId = socket.id;
        });

        socket.on('authFailed', (msg) => { document.getElementById('btn-auth').innerText = "Войти / Создать"; document.getElementById('auth-status').innerText = msg; });
        socket.on('init', (spawnPos) => { yawObject.position.set(spawnPos.x, 1.7, spawnPos.z); hp = 100; ammo = 30; updateHUD(); document.getElementById('respawn-screen').style.display = 'none'; });
        socket.on('timerUpdate', (data) => { const m = Math.floor(data.timeLeft / 60); const s = data.timeLeft % 60; document.getElementById('game-timer').innerText = `⏱️ Время: ${m}:${s < 10 ? '0' + s : s}`; });

        socket.on('updatePlayers', (serverPlayers) => {
            for (let id in serverPlayers) {
                if (id === socket.id) { kills = serverPlayers[id].kills; updateHUD(); continue; }
                let pData = serverPlayers[id];
                if (!remotePlayers[id] && pData.hp > 0) {
                    let group = new THREE.Group();
                    let b = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.4, 12), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
                    b.position.y = 0.7; b.userData = { targetId: id, zone: 'body' }; group.add(b);
                    let h = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                    h.position.y = 1.6; h.userData = { targetId: id, zone: 'head' }; group.add(h);
                    scene.add(group); remotePlayers[id] = group;
                }
                if (remotePlayers[id]) {
                    if (pData.hp <= 0) { scene.remove(remotePlayers[id]); delete remotePlayers[id]; } 
                    else { remotePlayers[id].position.set(pData.x, 0, pData.z); remotePlayers[id].rotation.y = pData.rotY; }
                }
            }
            for (let id in remotePlayers) { if (!serverPlayers[id]) { scene.remove(remotePlayers[id]); delete remotePlayers[id]; } }
        });

        function performShot() {
            if (ammo <= 0 || isReloading || hp <= 0) return;
            ammo--; updateHUD();

            // Анимация отдачи пушки
            if(weaponMesh) {
                weaponMesh.position.z = -0.38;
                setTimeout(() => weaponMesh.position.z = -0.45, 60);
            }

            let raycaster = new THREE.Raycaster(); raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            let targets = []; for (let id in remotePlayers) { targets.push(...remotePlayers[id].children); }
            let intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0) {
                let obj = intersects[0].object.userData; socket.emit('playerHit', { targetId: obj.targetId, zone: obj.zone });
            }
        }

        function startReload() {
            if (isReloading || ammo === 30 || reserveAmmo <= 0) return;
            isReloading = true; updateHUD();
            setTimeout(() => {
                let needed = 30 - ammo; let transfer = Math.min(needed, reserveAmmo);
                ammo += transfer; reserveAmmo -= transfer; isReloading = false; updateHUD();
            }, 1500);
        }

        function updateHUD() {
            document.getElementById('hud-hp').innerText = `❤️ HP: ${hp}`;
            document.getElementById('hud-ammo').innerText = isReloading ? `🔄 ПЕРЕЗАРЯДКА...` : `🔫 Патроны: ${ammo} / ${reserveAmmo}`;
            document.getElementById('kills-counter').innerText = `💀 Убийства: ${kills}`;
        }

        socket.on('updatePlayers', (serverPlayers) => {
            if (myId && serverPlayers[myId] && serverPlayers[myId].hp <= 0 && hp > 0) {
                hp = 0; updateHUD(); document.getElementById('respawn-screen').style.display = 'flex';
            }
        });

        document.getElementById('btn-respawn').addEventListener('click', () => socket.emit('requestRespawn'));

        // --- УЛУЧШЕННОЕ УПРАВЛЕНИЕ МУЛЬТИ ТАЧА (ИСПРАВЛЕНИЕ БАГА ОДНОВРЕМЕННОГО ДВИЖЕНИЯ) ---
        function setupControls() {
            const leftZone = document.getElementById('touch-zone-left');
            const rightZone = document.getElementById('touch-zone-right');
            const stick = document.getElementById('joystick-stick');
            const jZone = document.getElementById('joystick-zone');

            // КНОПКИ ИЗ НАБРОСКА
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); performShot(); });
            document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); startReload(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); if(isGrounded) playerVelocity.y = JUMP_FORCE; });
            
            // КНОПКА ПРИСЯДА
            document.getElementById('btn-crouch').addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                isCrouching = !isCrouching;
                if(isCrouching) {
                    moveSpeed = 6; // Замедление при присяде
                    document.getElementById('btn-crouch').style.background = "#3b82f6";
                } else {
                    moveSpeed = 14;
                    document.getElementById('btn-crouch').style.background = "#1e3a8a";
                }
            });

            document.getElementById('btn-fullscreen').addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });

            // Левая зона — обработка джойстика
            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for(let t of e.changedTouches) {
                    if(joystickTouchId === null) {
                        joystickTouchId = t.identifier;
                        updateJoystick(t);
                    }
                }
            });

            leftZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for(let t of e.changedTouches) {
                    if(t.identifier === joystickTouchId) updateJoystick(t);
                }
            });

            leftZone.addEventListener('touchend', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        stick.style.transform = `translate(0px, 0px)`;
                        moveDirection.forward = 0; moveDirection.right = 0;
                    }
                }
            });

            function updateJoystick(touch) {
                let rect = jZone.getBoundingClientRect();
                let dx = touch.clientX - (rect.left + rect.width / 2);
                let dy = touch.clientY - (rect.top + rect.height / 2);
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveDirection.forward = -(dy / 40); moveDirection.right = (dx / 40);
            }

            // Правая зона — обработка обзора (поворотов камеры)
            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for(let t of e.changedTouches) {
                    if(lookTouchId === null) {
                        lookTouchId = t.identifier;
                        lastLookX = t.clientX;
                        lastLookY = t.clientY;
                    }
                }
            });

            rightZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for(let t of e.changedTouches) {
                    if(t.identifier === lookTouchId) {
                        let dx = t.clientX - lastLookX;
                        let dy = t.clientY - lastLookY;
                        yawObject.rotation.y -= dx * lookSpeed;
                        pitchObject.rotation.x -= dy * lookSpeed;
                        pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x));
                        lastLookX = t.clientX;
                        lastLookY = t.clientY;
                    }
                }
            });

            rightZone.addEventListener('touchend', (e) => {
                for(let t of e.changedTouches) {
                    if(t.identifier === lookTouchId) lookTouchId = null;
                }
            });
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta(); if (delta > 0.1) delta = 0.1;

            if (myId && hp > 0) {
                playerVelocity.y -= GRAVITY * delta;
                let forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
                let sideVector = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);

                let moveX = (forwardVector.x * moveDirection.forward + sideVector.x * moveDirection.right) * moveSpeed * delta;
                let moveZ = (forwardVector.z * moveDirection.forward + sideVector.z * moveDirection.right) * moveSpeed * delta;

                let targetPos = yawObject.position.clone(); targetPos.x += moveX;
                if (!checkWallCollisions(targetPos)) yawObject.position.x = targetPos.x;

                targetPos = yawObject.position.clone(); targetPos.z += moveZ;
                if (!checkWallCollisions(targetPos)) yawObject.position.z = targetPos.z;

                yawObject.position.y += playerVelocity.y * delta;
                
                // Высота глаз с учетом присяда
                let targetHeight = isCrouching ? 0.9 : 1.7;
                if (yawObject.position.y <= targetHeight) { 
                    playerVelocity.y = 0; 
                    yawObject.position.y = targetHeight; 
                    isGrounded = true; 
                } else { 
                    isGrounded = false; 
                }

                socket.emit('playerMove', { x: yawObject.position.x, z: yawObject.position.z, rotY: yawObject.rotation.y });
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
